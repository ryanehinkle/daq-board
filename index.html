<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#111111" />
  <title>DAQ Board</title>
  <style>
    :root {
      color-scheme: dark;
      --app-font: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-family: var(--app-font);
      --text: rgba(255,255,255,.97);
      --muted: rgba(255,255,255,.72);
      --line: rgba(255,255,255,.28);
      --pill: rgba(215,215,220,.42);
      --panel: rgba(20,22,28,.86);
      --display-scale: 1;
    }
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #050505;
    }
    body {
      display: grid;
      place-items: center;
    }
    button, input {
      font: inherit;
    }

    /* The dashboard itself always remains 16:9 and letterboxes on other screens. */
    #board {
      position: relative;
      width: min(100vw, 177.777777vh);
      height: min(100vh, 56.25vw);
      overflow: hidden;
      isolation: isolate;
      background: #222 center / cover no-repeat;
      color: var(--text);
      text-shadow: 0 1px 3px rgba(0,0,0,.18);
    }
    .background-slot {
      position: absolute;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      opacity: 0;
      background: #000 center / cover no-repeat;
      pointer-events: none;
      transition: opacity .95s ease;
      will-change: opacity;
    }
    .background-slot.active { opacity: 1; }
    .background-slot.youtube-active { pointer-events: auto; }
    .background-slot iframe {
      position: absolute;
      inset: -1%;
      width: 102%;
      height: 102%;
      border: 0;
      pointer-events: auto;
    }
    .background-slot video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      border: 0;
      pointer-events: none;
    }

    /*
      Keep an active YouTube background non-interactive everywhere except the
      small bottom-right rectangle where YouTube places the Skip ad button.
    */
    .youtube-hit-shield {
      position: absolute;
      z-index: 4;
      display: none;
      background: transparent;
      pointer-events: auto;
    }
    .youtube-hit-shield.enabled { display: block; }
    .youtube-hit-shield.top {
      top: 0;
      left: 0;
      right: 0;
      bottom: 11.5%;
    }
    .youtube-hit-shield.bottom-left {
      left: 0;
      bottom: 0;
      width: 87.5%;
      height: 11.5%;
    }
    #board::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 1;
      background:
        linear-gradient(180deg, rgba(10,12,18,.22), rgba(10,12,18,.12) 55%, rgba(10,12,18,.18));
      pointer-events: none;
    }

    .clock-block {
      position: absolute;
      z-index: 2;
      left: 9.8%;
      top: 19.4%;
      width: 44%;
      user-select: none;
      transform: scale(var(--display-scale));
      transform-origin: top left;
    }
    .time-row {
      display: flex;
      align-items: flex-start;
      gap: .1em;
      line-height: .78;
      white-space: nowrap;
      font-weight: 200;
      letter-spacing: -.055em;
    }
    #clock-main {
      font-size: clamp(76px, 8.2vw, 158px);
    }
    #clock-seconds {
      margin-top: .02em;
      font-size: clamp(34px, 3.35vw, 68px);
      font-weight: 300;
      letter-spacing: -.04em;
    }
    #date-line {
      margin-top: 4.6%;
      font-size: clamp(24px, 2.05vw, 40px);
      font-weight: 400;
      letter-spacing: -.02em;
    }

    .weather-block {
      position: absolute;
      z-index: 2;
      right: 9.6%;
      top: 17.8%;
      width: 28%;
      min-width: 390px;
      user-select: none;
      transform: scale(var(--display-scale));
      transform-origin: top right;
    }
    .current-weather {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 14px;
      min-height: 84px;
      padding-right: 1%;
    }
    .sun-times {
      min-width: 126px;
      margin-right: 18px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      gap: 8px;
      color: #fff;
      font-family: var(--app-font);
      font-size: clamp(17px, 1.18vw, 23px);
      font-weight: 400;
      line-height: 1;
      letter-spacing: -.02em;
      white-space: nowrap;
      text-shadow: 0 1px 3px rgba(0,0,0,.18);
    }
    .sun-time-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .sun-time-icon {
      width: 26px;
      height: 21px;
      flex: 0 0 auto;
      color: #fff;
      filter: drop-shadow(0 1px 2px rgba(0,0,0,.18));
    }
    .sun-time-icon svg {
      display: block;
      width: 100%;
      height: 100%;
      overflow: visible;
    }
    .sun-time-icon path,
    .sun-time-icon line,
    .sun-time-icon circle {
      stroke: currentColor;
      fill: none;
      stroke-width: 2.15;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    #current-temp {
      font-size: clamp(46px, 4.2vw, 82px);
      font-weight: 300;
      letter-spacing: -.05em;
      line-height: 1;
    }
    #current-icon {
      width: clamp(62px, 4.75vw, 92px);
      height: clamp(62px, 4.75vw, 92px);
      display: grid;
      place-items: center;
    }

    #forecast {
      margin-top: 6.8%;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      align-items: start;
    }
    .day {
      text-align: center;
      min-width: 0;
    }
    .day-label {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 74px;
      height: 33px;
      padding: 0 13px;
      border-radius: 999px;
      background: var(--pill);
      font-size: clamp(16px, 1.07vw, 22px);
      font-weight: 650;
      line-height: 1;
      text-shadow: none;
      letter-spacing: .01em;
    }
    .day-icon {
      width: clamp(46px, 3.1vw, 62px);
      height: clamp(46px, 3.1vw, 62px);
      display: grid;
      place-items: center;
      margin: 8px auto 0;
    }
    .temps {
      margin-top: 0;
      display: flex;
      justify-content: center;
      gap: 13px;
      font-size: clamp(19px, 1.35vw, 27px);
      line-height: 1;
      font-weight: 400;
    }
    .temps span:last-child { opacity: .9; }

    .divider {
      position: absolute;
      z-index: 2;
      left: 9.8%;
      right: 9.8%;
      top: 50.7%;
      height: 1px;
      background: var(--line);
      box-shadow: 0 1px rgba(0,0,0,.08);
    }

    #settings-button {
      position: absolute;
      top: 1.1%;
      right: .7%;
      width: clamp(39px, 2.4vw, 48px);
      height: clamp(39px, 2.4vw, 48px);
      border: 0;
      border-radius: 999px;
      display: grid;
      place-items: center;
      cursor: pointer;
      color: #34404d;
      background: rgba(242,242,242,.82);
      box-shadow: 0 2px 8px rgba(0,0,0,.18);
      transition:
        opacity .18s ease,
        transform .22s cubic-bezier(.2,.9,.25,1.25),
        background .16s ease,
        visibility 0s linear .22s;
      z-index: 5;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transform: scale(.72) rotate(-14deg);
    }
    #settings-button.visible {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transform: scale(1) rotate(0deg);
      transition:
        opacity .18s ease,
        transform .22s cubic-bezier(.2,.9,.25,1.25),
        background .16s ease,
        visibility 0s;
    }
    #settings-button.visible:hover {
      transform: scale(1.06) rotate(0deg);
      background: rgba(255,255,255,.95);
    }
    #settings-button svg {
      width: 58%;
      height: 58%;
      fill: currentColor;
    }

    #settings {
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      position: absolute;
      inset: 0;
      z-index: 20;
      display: flex;
      align-items: flex-start;
      justify-content: flex-end;
      padding: 4.9% 1.1% 0 0;
      background: rgba(0,0,0,0);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition:
        opacity .18s ease,
        background .22s ease,
        visibility 0s linear .24s;
    }
    #settings.open {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      background: rgba(0,0,0,.16);
      transition:
        opacity .18s ease,
        background .22s ease,
        visibility 0s;
    }
    .settings-card {
      width: min(440px, 34vw);
      min-width: 350px;
      max-height: 88%;
      overflow-y: auto;
      padding: 22px;
      opacity: 0;
      transform: translateY(-10px) scale(.985);
      transform-origin: top right;
      transition:
        opacity .18s ease,
        transform .24s cubic-bezier(.2,.85,.3,1.08);
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 18px;
      background: var(--panel);
      box-shadow: 0 18px 50px rgba(0,0,0,.34);
      backdrop-filter: blur(18px);
      text-shadow: none;
    }
    #settings.open .settings-card {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
    .settings-title {
      font-size: 21px;
      font-weight: 700;
      margin-bottom: 18px;
    }
    .field {
      margin-top: 14px;
    }
    .field label {
      display: block;
      margin-bottom: 7px;
      font-size: 13px;
      color: rgba(255,255,255,.72);
      font-weight: 600;
    }
    .field input {
      width: 100%;
      height: 42px;
      appearance: none;
      -webkit-appearance: none;
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 10px;
      padding: 0 12px;
      outline: none;
      color: white;
      caret-color: white;
      background: rgba(255,255,255,.08) !important;
      box-shadow: none;
      transition: border-color .15s ease, background .15s ease;
    }
    .field input:focus {
      border-color: rgba(255,255,255,.34);
      background: rgba(255,255,255,.11) !important;
    }
    .field input:-webkit-autofill,
    .field input:-webkit-autofill:hover,
    .field input:-webkit-autofill:focus {
      -webkit-text-fill-color: #fff;
      caret-color: #fff;
      border: 1px solid rgba(255,255,255,.15);
      -webkit-box-shadow: 0 0 0 1000px #2a2b31 inset;
      box-shadow: 0 0 0 1000px #2a2b31 inset;
      transition: background-color 9999s ease-out 0s;
    }

    .field-label-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 7px;
    }
    .field-label-row label {
      margin: 0;
    }
    .icon-button {
      width: 27px;
      height: 27px;
      padding: 0;
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 8px;
      display: grid;
      place-items: center;
      cursor: pointer;
      color: rgba(255,255,255,.88);
      background: rgba(255,255,255,.08);
      font-size: 20px;
      line-height: 1;
    }
    .icon-button:hover { background: rgba(255,255,255,.15); }

    .background-mode-toggle {
      display: inline-flex;
      padding: 2px;
      border: 1px solid rgba(255,255,255,.13);
      border-radius: 9px;
      background: rgba(255,255,255,.045);
    }
    .background-mode-toggle button {
      height: 26px;
      min-width: 58px;
      padding: 0 10px;
      border: 0;
      border-radius: 7px;
      cursor: pointer;
      color: rgba(255,255,255,.58);
      background: transparent;
      font-size: 11px;
      font-weight: 650;
      transition: color .14s ease, background .14s ease, transform .14s ease;
    }
    .background-mode-toggle button:hover {
      color: rgba(255,255,255,.9);
    }
    .background-mode-toggle button.active {
      color: #fff;
      background: rgba(255,255,255,.15);
    }
    .background-cycle-field {
      margin-top: 10px;
    }
    .background-cycle-field[hidden] {
      display: none;
    }
    .background-cycle-field > label {
      margin-bottom: 6px;
    }
    .background-cycle-options {
      display: grid;
      grid-template-columns: repeat(9, minmax(0, 1fr));
      gap: 5px;
    }
    .background-cycle-option {
      min-width: 0;
      height: 32px;
      padding: 0;
      border: 1px solid rgba(255,255,255,.13);
      border-radius: 8px;
      cursor: pointer;
      color: rgba(255,255,255,.66);
      background: rgba(255,255,255,.045);
      font: inherit;
      font-size: 11px;
      font-weight: 650;
      transition: color .14s ease, background .14s ease, border-color .14s ease;
    }
    .background-cycle-option:hover {
      color: #fff;
      background: rgba(255,255,255,.09);
    }
    .background-cycle-option.selected {
      color: #fff;
      border-color: rgba(255,255,255,.28);
      background: rgba(255,255,255,.16);
    }

    .display-size-control {
      margin-top: 9px;
      padding: 9px 11px 8px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 10px;
      background: rgba(255,255,255,.045);
    }
    .display-size-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 5px;
      color: rgba(255,255,255,.7);
      font-size: 12px;
      font-weight: 600;
    }
    #display-size-value {
      color: rgba(255,255,255,.92);
      font-variant-numeric: tabular-nums;
    }
    #display-size-slider {
      width: 100%;
      height: 18px;
      margin: 0;
      padding: 0;
      cursor: pointer;
      accent-color: #fff;
      background: transparent !important;
    }

    .custom-select {
      position: relative;
      width: 100%;
    }
    .custom-select-button {
      width: 100%;
      min-height: 42px;
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 10px;
      padding: 0 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      cursor: pointer;
      color: white;
      background: rgba(255,255,255,.08);
      text-align: left;
    }
    .custom-select-button:hover,
    .custom-select.open .custom-select-button {
      border-color: rgba(255,255,255,.34);
      background: rgba(255,255,255,.11);
    }
    .chevron {
      width: 8px;
      height: 8px;
      flex: 0 0 auto;
      border-right: 2px solid rgba(255,255,255,.78);
      border-bottom: 2px solid rgba(255,255,255,.78);
      transform: rotate(45deg) translateY(-2px);
      transition: transform .15s ease;
    }
    .custom-select.open .chevron {
      transform: rotate(225deg) translate(-2px,-2px);
    }
    .custom-select-menu {
      max-height: 0;
      margin-top: 0;
      padding: 0 5px;
      overflow: hidden;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transform: translateY(-7px) scale(.985);
      transform-origin: top center;
      border: 1px solid rgba(255,255,255,0);
      border-radius: 11px;
      background: rgba(30,32,39,.98);
      box-shadow: 0 12px 30px rgba(0,0,0,.34);
      transition:
        max-height .24s cubic-bezier(.2,.8,.25,1),
        margin-top .18s ease,
        padding .18s ease,
        opacity .16s ease,
        transform .2s cubic-bezier(.2,.8,.25,1),
        border-color .18s ease,
        visibility 0s linear .25s;
    }
    .custom-select.open .custom-select-menu {
      max-height: 340px;
      margin-top: 6px;
      padding: 5px;
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transform: translateY(0) scale(1);
      border-color: rgba(255,255,255,.15);
      transition:
        max-height .25s cubic-bezier(.2,.8,.25,1),
        margin-top .18s ease,
        padding .18s ease,
        opacity .17s ease,
        transform .22s cubic-bezier(.2,.8,.25,1),
        border-color .18s ease,
        visibility 0s;
    }
    .custom-option {
      width: 100%;
      min-height: 38px;
      border: 0;
      border-radius: 8px;
      padding: 0 10px;
      display: flex;
      align-items: center;
      cursor: pointer;
      color: rgba(255,255,255,.88);
      background: transparent;
      text-align: left;
    }
    .custom-option:hover { background: rgba(255,255,255,.10); }
    .custom-option.selected {
      color: #fff;
      background: rgba(255,255,255,.14);
      font-weight: 650;
    }

    .background-button {
      padding: 6px 9px 6px 7px;
      min-height: 52px;
    }
    .background-current {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .background-thumb {
      width: 62px;
      height: 36px;
      flex: 0 0 auto;
      overflow: hidden;
      border-radius: 7px;
      background: rgba(255,255,255,.08) center / cover no-repeat;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.08);
    }
    .background-thumb.video-generic {
      display: grid;
      place-items: center;
      font-size: 15px;
    }
    .background-title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 600;
    }
    .custom-select-button .background-title {
      font-weight: 400;
    }
    #background-menu {
      max-height: 0;
      overflow-y: hidden;
    }
    #background-select.open #background-menu {
      max-height: 285px;
      overflow-y: auto;
    }
    #music-menu {
      max-height: 0;
      overflow-y: hidden;
    }
    #music-select.open #music-menu {
      max-height: 285px;
      overflow-y: auto;
    }
    .music-menu-top {
      position: sticky;
      top: 0;
      z-index: 3;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 4px 6px;
      background: rgba(30,32,39,.98);
    }
    .music-menu-top .background-option {
      width: auto;
      flex: 1 1 auto;
      min-width: 0;
      min-height: 44px;
    }
    .music-menu-top .background-thumb {
      width: 54px;
      height: 32px;
    }
    .music-menu-top .background-menu-add {
      flex: 0 0 34px;
      margin-left: 0;
    }
    .music-editor {
      max-height: 0;
      margin-top: 0;
      padding: 0 12px;
      overflow: hidden;
      opacity: 0;
      visibility: hidden;
      transform: translateY(-7px) scale(.985);
      transform-origin: top center;
      border: 1px solid rgba(255,255,255,0);
      border-radius: 12px;
      background: rgba(255,255,255,.055);
      box-shadow: inset 0 1px rgba(255,255,255,.035);
      transition:
        max-height .25s cubic-bezier(.2,.8,.25,1),
        margin-top .2s ease,
        padding .2s ease,
        opacity .16s ease,
        transform .22s cubic-bezier(.2,.8,.25,1),
        border-color .2s ease,
        visibility 0s linear .25s;
    }
    .music-editor.open {
      max-height: 190px;
      margin-top: 8px;
      padding: 12px;
      opacity: 1;
      visibility: visible;
      transform: translateY(0) scale(1);
      border-color: rgba(255,255,255,.13);
      transition:
        max-height .25s cubic-bezier(.2,.8,.25,1),
        margin-top .2s ease,
        padding .2s ease,
        opacity .17s ease,
        transform .23s cubic-bezier(.2,.8,.25,1),
        border-color .2s ease,
        visibility 0s;
    }
    .music-editor input + input { margin-top: 8px; }
    .background-filter {
      position: sticky;
      top: 0;
      z-index: 3;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 4px 9px;
      background: rgba(30,32,39,.98);
    }
    .field label.background-filter-check {
      display: inline-flex;
      margin-bottom: 0;
    }
    .background-filter-check {
      min-width: 98px;
      height: 34px;
      padding: 0 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 9px;
      cursor: pointer;
      color: rgba(255,255,255,.72);
      background: rgba(255,255,255,.045);
      font-size: 12px;
      font-weight: 700;
      user-select: none;
      white-space: nowrap;
      transition:
        background .15s ease,
        color .15s ease,
        border-color .15s ease,
        transform .15s ease;
    }
    .background-filter-check:hover {
      color: rgba(255,255,255,.95);
      background: rgba(255,255,255,.085);
      transform: translateY(-1px);
    }
    .background-filter-check:has(input:checked) {
      color: #fff;
      border-color: rgba(255,255,255,.25);
      background: rgba(255,255,255,.13);
    }
    .background-filter-check input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }
    .background-filter-box {
      width: 15px;
      height: 15px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255,255,255,.34);
      border-radius: 5px;
      background: rgba(255,255,255,.035);
      transition: background .14s ease, border-color .14s ease, transform .14s ease;
    }
    .background-filter-box::after {
      content: "";
      width: 6px;
      height: 3px;
      border-left: 2px solid #15171b;
      border-bottom: 2px solid #15171b;
      opacity: 0;
      transform: rotate(-45deg) translateY(-1px) scale(.7);
      transition: opacity .12s ease, transform .14s ease;
    }
    .background-filter-check input:checked + .background-filter-box {
      border-color: rgba(255,255,255,.9);
      background: rgba(255,255,255,.9);
      transform: scale(1.03);
    }
    .background-filter-check input:checked + .background-filter-box::after {
      opacity: 1;
      transform: rotate(-45deg) translateY(-1px) scale(1);
    }
    .background-menu-add {
      width: 34px;
      height: 34px;
      margin-left: auto;

      function cloneDefaultBackgrounds() {
        return DEFAULTS.backgrounds.map(item => ({ ...item }));

      function loadSettings() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) {
            return {
              ...DEFAULTS,
              backgrounds: cloneDefaultBackgrounds(),
              music: [],
              selectedMusicId: ""
            };
          }

          const saved = JSON.parse(raw) || {};
          const hasPresetList = Array.isArray(saved.backgrounds);
          let backgrounds = hasPresetList
            ? saved.backgrounds.filter(item => item && item.id && item.url && item.type)
            : cloneDefaultBackgrounds();

          // Clean up only the known old built-in values. Custom presets stay untouched.
          backgrounds = backgrounds.map(item => {
            if (
              item.id === "default-image" &&
              item.url === DEFAULT_BACKGROUND_URL

              return { ...item, name: "Mountain Night Sky", type: "image", url: DEFAULT_BACKGROUND_URL };
            }

                item.url === "https://www.youtube.com/watch?v=i3gUonr3d9U" ||
                item.url === "https://www.youtube.com/watch?v=i3qUonr3d9U"
              )
            ) {
              return {
                ...item,
                name: "Neon Sunset Drive",
                type: "video",
                url: "https://www.youtube.com/watch?v=i3qUonr3d9U"
              };
            }

            return {
              ...item,
              name: item.name === "Image Background"
                ? "Mountain Night Sky"
                : item.name === "YouTube Background"
                  ? "Neon Sunset Drive"
                  : item.name
            };
          });

          let selectedBackgroundId = hasPresetList
            ? (saved.selectedBackgroundId || "")
            : "default-video";
          if (!backgrounds.some(item => item.id === selectedBackgroundId)) {
            selectedBackgroundId = "";
          }

          const backgroundMode = saved.backgroundMode === "rotate" ? "rotate" : "static";
          let selectedBackgroundIds = Array.isArray(saved.selectedBackgroundIds)
            ? Array.from(new Set(saved.selectedBackgroundIds)).filter(id => backgrounds.some(item => item.id === id))
            : (selectedBackgroundId ? [selectedBackgroundId] : []);

          if (backgroundMode === "static") {
            selectedBackgroundIds = selectedBackgroundId ? [selectedBackgroundId] : [];
          } else if (!selectedBackgroundId || !selectedBackgroundIds.includes(selectedBackgroundId)) {
            selectedBackgroundId = selectedBackgroundIds[0] || "";
          }

          const allowedCycleMinutes = [0.5, 5, 10, 15, 30, 45, 60, 90, 120];
          const savedCycleMinutes = Number(saved.backgroundCycleMinutes);
          const backgroundCycleMinutes = allowedCycleMinutes.includes(savedCycleMinutes)
            ? savedCycleMinutes
            : DEFAULTS.backgroundCycleMinutes;

          const music = Array.isArray(saved.music)
            ? saved.music.filter(item => item && item.id && item.name && item.url)
            : [];
          let selectedMusicId = saved.selectedMusicId || "";
          if (!music.some(item => item.id === selectedMusicId)) selectedMusicId = "";

          const savedCoordinates = saved.coordinates || DEFAULTS.coordinates;
          return {
            coordinates: savedCoordinates === "41.79722, -88.17000"
              ? DEFAULTS.coordinates
              : savedCoordinates,
            weatherSource: (saved.weatherSource === "nbm" || saved.weatherSource === "best_match")
              ? "nws"
              : (WEATHER_SOURCES[saved.weatherSource] ? saved.weatherSource : DEFAULTS.weatherSource),
            googleWeatherApiKey: saved.googleWeatherApiKey || "",
            clockAnimation: CLOCK_ANIMATIONS[saved.clockAnimation] ? saved.clockAnimation : DEFAULTS.clockAnimation,
            font: FONT_OPTIONS[saved.font] ? saved.font : DEFAULTS.font,
            backgrounds,
            selectedBackgroundId,
            backgroundMode,
            selectedBackgroundIds,
            backgroundCycleMinutes,
            music,
            selectedMusicId
          };
        } catch {
          return {
            ...DEFAULTS,
            backgrounds: cloneDefaultBackgrounds()
          };
        }
      }

      function persistSettings() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(settings));
      }

      function validSharedPresetPayload(data) {
        return data &&
          Array.isArray(data.backgrounds) &&
          Array.isArray(data.music);
      }

      function sanitizeSharedPresets(data) {
        const clean = validSharedPresetPayload(data)
          ? data
          : { version: 1, backgrounds: cloneDefaultBackgrounds(), music: [] };

        const backgrounds = clean.backgrounds
          .filter(item => item && item.id && item.name && item.type && item.url)
          .map(item => {
            if (item.id === "default-image") {
              return {
                id: "default-image",
                name: "Mountain Night Sky",
                type: "image",
                url: DEFAULT_BACKGROUND_URL
              };
            }
            if (item.id === "default-video") {
              return {
                id: "default-video",
                name: "Neon Sunset Drive",
                type: "video",
                url: "https://www.youtube.com/watch?v=i3qUonr3d9U"
              };
            }
            return {
              id: String(item.id),
              name: String(item.name),
              type: item.type === "video" ? "video" : "image",
              url: String(item.url)
            };
          });

        const music = clean.music
          .filter(item => item && item.id && item.name && item.url)
          .map(item => ({
            id: String(item.id),
            name: String(item.name),
            url: String(item.url)
          }));

        return {
          version: Number(clean.version) || 1,
          backgrounds,
          music
        };
      }

      function applySharedPresets(data) {
        const clean = sanitizeSharedPresets(data);
        settings.backgrounds = clean.backgrounds;
        settings.music = clean.music;

        settings.selectedBackgroundIds = (settings.selectedBackgroundIds || [])
          .filter(id => settings.backgrounds.some(item => item.id === id));

        if (!settings.backgrounds.some(item => item.id === settings.selectedBackgroundId)) {
          settings.selectedBackgroundId = settings.backgroundMode === "rotate"
            ? (settings.selectedBackgroundIds[0] || "")
            : "";
        }
        if (settings.backgroundMode === "static") {
          settings.selectedBackgroundIds = settings.selectedBackgroundId
            ? [settings.selectedBackgroundId]
            : [];
        }

        if (!settings.music.some(item => item.id === settings.selectedMusicId)) {
          settings.selectedMusicId = "";
        }

        persistSettings();
      }

      async function fetchSharedPresetStore() {
        const res = await fetch(SHARED_STORE_URL + "?t=" + Date.now(), {
          cache: "no-store",
          headers: { Accept: "application/json" }
        });
        if (!res.ok) throw new Error("Could not load shared presets");
        return sanitizeSharedPresets(await res.json());
      }

      async function putSharedPresetStore(data) {
        const clean = sanitizeSharedPresets(data);
        clean.version = Math.max(1, Number(clean.version) || 1) + 1;

        const res = await fetch(SHARED_STORE_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Accept: "application/json"
          },
          body: JSON.stringify(clean)
        });
        if (!res.ok) throw new Error("Could not save shared presets");
        return clean;
      }

      function mergeUniquePresets(remote, local) {
        const byId = new Map(remote.map(item => [item.id, item]));
        local.forEach(item => {
          if (!byId.has(item.id)) byId.set(item.id, item);
        });
        return Array.from(byId.values());
      }

      async function bootstrapSharedPresets() {
        const localBackgrounds = [...settings.backgrounds];
        const localMusic = [...settings.music];

        try {
          let remote = await fetchSharedPresetStore();

          // One-time migration so presets already created on a device before this
          // backend existed are not lost. After this marker is set, GitHub/local
          // browser state is never used as the shared source again.
          if (localStorage.getItem(SHARED_STORE_MIGRATION_KEY) !== "1") {
            const merged = {
              ...remote,
              backgrounds: mergeUniquePresets(remote.backgrounds, localBackgrounds),
              music: mergeUniquePresets(remote.music, localMusic)
            };

            const changed =
              merged.backgrounds.length !== remote.backgrounds.length ||
              merged.music.length !== remote.music.length;

            if (changed) {
              try {
                remote = await putSharedPresetStore(merged);
              } catch {}
            }

            localStorage.setItem(SHARED_STORE_MIGRATION_KEY, "1");
          }

          applySharedPresets(remote);
          return true;
        } catch {
          // Keep the local list usable while the backend/bootstrap is unavailable.
          return false;
        }
      }

      async function loadSharedPresets() {
        try {
          const remote = await fetchSharedPresetStore();
          applySharedPresets(remote);
          return true;
        } catch {
          return false;
        }
      }

      async function updateSharedPresets(mutator, successMessage = "Shared everywhere") {
        // Read-modify-write from the latest shared state so one device does not
        // blindly replace presets another device added.
        for (let attempt = 0; attempt < 3; attempt++) {
          try {
            const current = await fetchSharedPresetStore();
            const draft = sanitizeSharedPresets(current);
            const next = sanitizeSharedPresets(mutator(draft) || draft);
            const saved = await putSharedPresetStore(next);

            // Verify the requested state actually survived a possible near-simultaneous write.
            const verify = await fetchSharedPresetStore();
            applySharedPresets(verify);

            if (JSON.stringify(sanitizeSharedPresets(saved)) !== JSON.stringify(sanitizeSharedPresets(verify))) {
              if (attempt < 2) continue;
            }

            showStatus(successMessage);
            return true;
          } catch {
            if (attempt === 2) {
              showStatus("Saved here — shared sync will retry");
              return false;
            }
            await new Promise(resolve => setTimeout(resolve, 120 + attempt * 140));
          }
        }
        return false;
      }

      function showStatus(message) {
        statusEl.textContent = message;
        statusEl.classList.add("show");
        clearTimeout(statusTimer);
        statusTimer = setTimeout(() => statusEl.classList.remove("show"), 2200);
      }

      function youtubeVideoId(value) {
        const raw = String(value || "").trim();
        if (!raw) return "";
        try {
          const url = new URL(raw);
          const host = url.hostname.replace(/^www\./, "").toLowerCase();
          if (host === "youtu.be") return url.pathname.split("/").filter(Boolean)[0] || "";
          if (host === "youtube.com" || host === "m.youtube.com" || host === "music.youtube.com") {
            if (url.pathname === "/watch") return url.searchParams.get("v") || "";
            const parts = url.pathname.split("/").filter(Boolean);
            if (["embed", "shorts", "live"].includes(parts[0])) return parts[1] || "";
          }
        } catch {}
        return /^[A-Za-z0-9_-]{11}$/.test(raw) ? raw : "";
      }

      function backgroundKey(item) {
        return item ? item.type + ":" + item.url : "none";
      }

      function clearBackgroundSlot(slot) {
        slot.classList.remove("youtube-active");
        slot.dataset.mediaType = "";
        slot.dataset.backgroundKey = "";
        slot.style.backgroundImage = "";
        slot.style.backgroundColor = "#000";
        Array.from(slot.querySelectorAll("video")).forEach(video => {
          try { video.pause(); } catch {}
        });
        slot.replaceChildren();
      }

      function waitForMediaEvent(target, eventName, timeoutMs) {
        return new Promise(resolve => {
          let done = false;
          const finish = success => {
            if (done) return;
            done = true;
            clearTimeout(timer);
            target.removeEventListener(eventName, onReady);
            resolve(success);
          };
          const onReady = () => finish(true);
          const timer = setTimeout(() => finish(false), timeoutMs);
          target.addEventListener(eventName, onReady, { once: true });
        });
      }

      function youtubeBackgroundSrc(url) {
        const id = youtubeVideoId(url);
        if (!id) return "";

        const params = new URLSearchParams({
          autoplay: "1",
          mute: "1",
          loop: "1",
          playlist: id,
          start: "120",
          controls: "0",
          disablekb: "1",
          fs: "0",
          iv_load_policy: "3",
          rel: "0",
          playsinline: "1",
          cc_load_policy: "0"
        });
        return "https://www.youtube.com/embed/" + id + "?" + params.toString();
      }

      async function prepareBackgroundInSlot(slot, item) {
        clearBackgroundSlot(slot);

        if (!item) {
          slot.style.backgroundImage = "linear-gradient(145deg,#303747,#0d1018)";
          slot.dataset.mediaType = "none";
          slot.dataset.backgroundKey = backgroundKey(item);
          return;
        }

        if (item.type === "image") {
          const image = new Image();
          image.decoding = "async";
          image.src = item.url;
          await new Promise((resolve, reject) => {
            const timer = setTimeout(() => reject(new Error("Image preload timed out")), 6000);
            image.onload = () => {
              clearTimeout(timer);
              resolve();
            };
            image.onerror = () => {
              clearTimeout(timer);
              reject(new Error("Image preload failed"));
            };
          });
          slot.style.backgroundImage =
            'linear-gradient(180deg,rgba(10,12,18,.05),rgba(10,12,18,.02)),url("' +
            item.url.replace(/"/g, "%22") + '")';
          slot.dataset.mediaType = "image";
          slot.dataset.backgroundKey = backgroundKey(item);
          return;
        }

        const youtubeSrc = youtubeBackgroundSrc(item.url);
        if (youtubeSrc) {
          const iframe = document.createElement("iframe");
          iframe.title = "YouTube background";
          iframe.allow = "autoplay; encrypted-media";
          iframe.referrerPolicy = "strict-origin-when-cross-origin";
          iframe.tabIndex = -1;
          iframe.src = youtubeSrc;
          slot.appendChild(iframe);

          // Load the next player while the current background is still fully visible.
          // Give YouTube a short extra buffer after the iframe itself reports loaded.
          const loaded = await waitForMediaEvent(iframe, "load", 6500);
          if (!loaded) throw new Error("YouTube preload timed out");
          await new Promise(resolve => setTimeout(resolve, 1100));
          slot.dataset.mediaType = "youtube";
          slot.dataset.backgroundKey = backgroundKey(item);
          return;
        }

        const video = document.createElement("video");
        video.src = item.url;
        video.autoplay = true;
        video.muted = true;
        video.loop = false;
        video.playsInline = true;
        video.preload = "auto";

        const startAtIntroSkip = () => {
          if (Number.isFinite(video.duration) && video.duration > 121) {
            try { video.currentTime = 120; } catch {}
          }
        };
        video.addEventListener("loadedmetadata", startAtIntroSkip, { once: true });
        video.addEventListener("ended", () => {
          startAtIntroSkip();
          video.play().catch(() => {});
        });
        slot.appendChild(video);
        video.play().catch(() => {});

        const canPlay = await waitForMediaEvent(video, "canplay", 6500);
        if (!canPlay) throw new Error("Video preload timed out");
        startAtIntroSkip();
        video.play().catch(() => {});
        slot.dataset.mediaType = "video";
        slot.dataset.backgroundKey = backgroundKey(item);
      }

      function updateYoutubeHitArea() {
        const isYoutube = activeBackgroundSlot?.dataset.mediaType === "youtube";
        activeBackgroundSlot?.classList.toggle("youtube-active", isYoutube);
        const otherSlot = activeBackgroundSlot === backgroundSlotA ? backgroundSlotB : backgroundSlotA;
        otherSlot.classList.remove("youtube-active");
        youtubeHitShields.forEach(shield => shield.classList.toggle("enabled", isYoutube));
      }

      async function showBackgroundItem(item, { force = false, fade = true } = {}) {
        const nextKey = backgroundKey(item);
        if (!force && activeBackgroundKey === nextKey) return false;

        const token = ++backgroundTransitionToken;
        const nextSlot = activeBackgroundSlot === backgroundSlotA ? backgroundSlotB : backgroundSlotA;
        const oldSlot = activeBackgroundSlot;
        const alreadyPrepared = nextSlot.dataset.backgroundKey === nextKey;

        if (!alreadyPrepared) {
          try {
            await prepareBackgroundInSlot(nextSlot, item);
          } catch {
            clearBackgroundSlot(nextSlot);
            return false;
          }
        }

        if (token !== backgroundTransitionToken) {
          clearBackgroundSlot(nextSlot);
          return false;
        }

        const shouldFade = fade && activeBackgroundKey !== null;
        if (!shouldFade) {
          nextSlot.style.transition = "none";
          oldSlot.style.transition = "none";
        } else {
          nextSlot.style.transition = "opacity .95s ease";
          oldSlot.style.transition = "opacity .95s ease";
        }

        nextSlot.classList.add("active");
        oldSlot.classList.remove("active");

        activeBackgroundSlot = nextSlot;
        activeBackgroundKey = nextKey;
        updateYoutubeHitArea();

        if (shouldFade) {
          await new Promise(resolve => setTimeout(resolve, 980));
        }

        if (token === backgroundTransitionToken) {
          clearBackgroundSlot(oldSlot);
          oldSlot.style.transition = "opacity .95s ease";
          nextSlot.style.transition = "opacity .95s ease";
        }
        return true;
      }

      function selectedBackground() {
        return settings.backgrounds.find(item => item.id === settings.selectedBackgroundId) || null;
      }

      function rotatingBackgroundIds() {
        const valid = new Set(settings.backgrounds.map(item => item.id));
        return Array.from(new Set(settings.selectedBackgroundIds || []))
          .filter(id => valid.has(id));
      }

      function shuffled(values) {
        const copy = [...values];
        for (let i = copy.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [copy[i], copy[j]] = [copy[j], copy[i]];
        }
        return copy;
      }

      function resetBackgroundShuffle() {
        backgroundShuffleQueue = [];
      }

      function nextRotatingBackgroundId() {
        const ids = rotatingBackgroundIds();
        if (!ids.length) return "";
        if (ids.length === 1) return ids[0];

        backgroundShuffleQueue = backgroundShuffleQueue
          .filter(id => ids.includes(id) && id !== settings.selectedBackgroundId);

        if (!backgroundShuffleQueue.length) {
          backgroundShuffleQueue = shuffled(
            ids.filter(id => id !== settings.selectedBackgroundId)
          );
        }

        return backgroundShuffleQueue.shift() || "";
      }

      function scheduleBackgroundCycle() {
        clearTimeout(backgroundCycleTimer);
        clearTimeout(backgroundPreloadTimer);
        backgroundCycleTimer = null;
        backgroundPreloadTimer = null;

        const ids = rotatingBackgroundIds();
        if (settings.backgroundMode !== "rotate" || ids.length < 2) return;

        const minutes = Number(settings.backgroundCycleMinutes) || 15;
        const cycleMs = minutes * 60 * 1000;
        const nextId = nextRotatingBackgroundId();
        const nextItem = settings.backgrounds.find(item => item.id === nextId) || null;
        if (!nextItem) return;

        const preloadToken = ++backgroundPreloadToken;
        const preloadLeadMs = Math.min(15000, Math.max(1000, cycleMs - 1000));
        const preloadDelay = Math.max(0, cycleMs - preloadLeadMs);

        backgroundPreloadTimer = setTimeout(async () => {
          const nextSlot = activeBackgroundSlot === backgroundSlotA ? backgroundSlotB : backgroundSlotA;

          try {
            await prepareBackgroundInSlot(nextSlot, nextItem);
          } catch {
            clearBackgroundSlot(nextSlot);
            return;
          }

          if (preloadToken !== backgroundPreloadToken || nextSlot === activeBackgroundSlot) {
            clearBackgroundSlot(nextSlot);
          }
        }, preloadDelay);

        backgroundCycleTimer = setTimeout(async () => {
          const currentNextItem = settings.backgrounds.find(item => item.id === nextId) || null;
          if (!currentNextItem) {
            scheduleBackgroundCycle();
            return;
          }

          const previousId = settings.selectedBackgroundId;
          const shown = await showBackgroundItem(currentNextItem, { fade: true });

          if (shown || activeBackgroundKey === backgroundKey(currentNextItem)) {
            settings.selectedBackgroundId = nextId;
            persistSettings();
            renderBackgroundPicker();
          } else {
            settings.selectedBackgroundId = previousId;
            persistSettings();
            renderBackgroundPicker();
          }

          scheduleBackgroundCycle();
        }, cycleMs);
      }

      async function applySelectedBackground({ force = false, fade = true } = {}) {
        if (settings.backgroundMode === "rotate") {
          const ids = rotatingBackgroundIds();
          if (!ids.includes(settings.selectedBackgroundId)) {
            settings.selectedBackgroundId = ids[0] || "";
          }
        }

        await showBackgroundItem(selectedBackground(), { force, fade });
        scheduleBackgroundCycle();
      }

      function backgroundThumbnail(item) {
        if (!item) return "";
        if (item.type === "image") return item.url;
        const id = youtubeVideoId(item.url);
        return id ? "https://i.ytimg.com/vi/" + id + "/hqdefault.jpg" : "";
      }

      function escapeHtml(value) {
        return String(value || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function animateBackgroundRowsIn() {
        const rows = Array.from(backgroundMenu.querySelectorAll(".background-option"));
        rows.forEach((row, index) => {
          row.animate([
            { opacity: 0, transform: "translateY(5px) scale(.985)" },
            { opacity: 1, transform: "translateY(0) scale(1)" }
          ], {
            duration: 150,
            delay: Math.min(index * 22, 110),
            easing: "cubic-bezier(.2,.8,.25,1)"
          });
        });
      }

      function renderBackgroundPicker({ animateRows = false } = {}) {
        const current = selectedBackground();
        const thumb = backgroundThumbnail(current);
        const rotateIds = rotatingBackgroundIds();
        const rotateMode = settings.backgroundMode === "rotate";

        backgroundCurrent.innerHTML = current

      function clockFrames(mode) {
        const frames = {
          fade: [
            { opacity: .35 },
            { opacity: 1 }
          ],
          slide: [
            { opacity: .18, transform: "translateY(7px)" },
            { opacity: 1, transform: "translateY(0)" }
          ],
          flip: [
            { opacity: .25, transform: "perspective(420px) rotateX(48deg)" },
            { opacity: 1, transform: "perspective(420px) rotateX(0deg)" }
          ],
          scale: [
            { opacity: .35, transform: "scale(.955)" },
            { opacity: 1, transform: "scale(1)" }
          ],
          blur: [
            { opacity: .32, filter: "blur(5px)" },
            { opacity: 1, filter: "blur(0px)" }
          ],
          drop: [
            { opacity: .2, transform: "translateY(-8px)" },
            { opacity: 1, transform: "translateY(0)" }
          ],
          tilt: [
            { opacity: .3, transform: "rotate(-3deg) translateY(3px)" },
            { opacity: 1, transform: "rotate(0deg) translateY(0)" }
          ],
          pulse: [
            { opacity: .55, transform: "scale(1.045)" },
            { opacity: 1, transform: "scale(1)" }
          ],
          glow: [
            { opacity: .45, textShadow: "0 0 14px rgba(255,255,255,.75)" },
            { opacity: 1, textShadow: "0 1px 3px rgba(0,0,0,.18)" }
          ]
        };
        return frames[mode] || frames.fade;
      }

      function updateClock() {
        const now = new Date();
        try {
          const timeParts = new Intl.DateTimeFormat("en-US", {
            timeZone: timezone,
            hour: "numeric",
            minute: "2-digit",
            second: "2-digit",
            hour12: true
          }).formatToParts(now);

          const get = type => timeParts.find(p => p.type === type)?.value || "";
          const next = [
            [clockMain, get("hour") + ":" + get("minute")],
            [clockSeconds, get("second")],
            [dateLine, new Intl.DateTimeFormat("en-US", {
              timeZone: timezone,
              weekday: "long",
              month: "long",
              day: "numeric"
            }).format(now)]
          ];

          const changed = next.filter(([el, value]) => el.textContent !== value);
          if (!changed.length) return;

          changed.forEach(([el, value]) => {
            el.getAnimations?.().forEach(animation => animation.cancel());
            el.textContent = value;
          });

          const mode = settings.clockAnimation || "fade";
          if (mode === "none") return;

          // Every changed clock element starts on the exact same animation frame,
          // so seconds/minutes never visually stagger.
          requestAnimationFrame(() => {
            const frames = clockFrames(mode);
            changed.forEach(([el]) => {
              el.animate(frames, {
                duration: 165,
                easing: "cubic-bezier(.2,.8,.25,1)",
                fill: "none"
              });
            });
          });
        } catch {
          timezone = "UTC";
        }
      }

      let clockTickTimer = null;
      function scheduleClockTick() {
        clearTimeout(clockTickTimer);
        updateClock();
        const delay = Math.max(40, 1000 - (Date.now() % 1000) + 8);
        clockTickTimer = setTimeout(scheduleClockTick, delay);
      }

      function iconSvg(kind) {
        const sun = '<circle class="wx-stroke" cx="32" cy="32" r="11"/>' +
          '<path class="wx-stroke" d="M32 7v7M32 50v7M7 32h7M50 32h7M14.3 14.3l5 5M44.7 44.7l5 5M49.7 14.3l-5 5M19.3 44.7l-5 5"/>';
        const cloud = '<path class="wx-fill" d="M20 47h28.5c7.5 0 13.5-5.8 13.5-13 0-6.8-5.4-12.4-12.3-13-2-7.3-8.8-12-16.4-12-9 0-16.5 6.6-17.6 15.2C8.9 25.6 4 30.6 4 36.5 4 42.3 9.1 47 15.4 47H20Z"/>';
        const cloudStroke = '<path class="wx-stroke" d="M17 44h31c6.6 0 12-5.1 12-11.5S54.6 21 48 21h-1.2C44.7 13.9 38.3 9 31 9c-9 0-16.4 6.6-17.5 15.2C7.6 25.1 3 29.7 3 35.5 3 40.2 7.6 44 13.2 44H17Z"/>';
        const rain = '<path class="wx-stroke" d="M18 53l-2 6M31 53l-2 6M44 53l-2 6"/>';
        const snow = '<path class="wx-stroke" d="M18 52v7M14.5 55.5h7M31 52v7M27.5 55.5h7M44 52v7M40.5 55.5h7"/>';
        const bolt = '<path class="wx-fill" d="M30 47h12l-9 15 2-11H24l10-17-4 13Z"/>';
        const fog = '<path class="wx-stroke" d="M10 48h44M14 55h36"/>';

        let content = cloudStroke;
        if (kind === "sun") content = sun;
        if (kind === "partly") content = '<g transform="translate(-4,-5) scale(.72)">' + sun + '</g>' + cloud;
        if (kind === "cloud") content = cloudStroke;
        if (kind === "rain") content = cloud + rain;
        if (kind === "storm") content = cloud + bolt;
        if (kind === "snow") content = cloud + snow;
        if (kind === "fog") content = cloudStroke + fog;

        return '<svg class="wx-svg" viewBox="0 0 64 64" aria-hidden="true" style="color:#fff">' + content + '</svg>';
      }

      function weatherKind(code) {
        if (code === 0) return "sun";
        if ([1,2].includes(code)) return "partly";
        if (code === 3) return "cloud";
        if ([45,48].includes(code)) return "fog";
        if ([51,53,55,56,57,61,63,65,66,67,80,81,82].includes(code)) return "rain";
        if ([71,73,75,77,85,86].includes(code)) return "snow";
        if ([95,96,99].includes(code)) return "storm";
        return "cloud";
      }

      function dmsToDecimal(deg, min, sec, dir) {
        let value = Math.abs(Number(deg)) + (Number(min || 0) / 60) + (Number(sec || 0) / 3600);
        if (/^[SW]$/i.test(dir)) value *= -1;
        return value;
      }

      function parseCoordinates(input) {
        const raw = String(input || "")
          .trim()
          .replace(/[−–—]/g, "-")
          .replace(/[′’]/g, "'")
          .replace(/[″”]/g, '"');
        if (!raw) throw new Error("Enter coordinates.");

        // Labeled decimals: lat: 41.79, lon: -88.17 (labels may appear in either order).
        const latLabel = raw.match(/(?:latitude|lat)\s*[:=]?\s*([+-]?\d+(?:\.\d+)?)/i);
        const lonLabel = raw.match(/(?:longitude|lon|lng)\s*[:=]?\s*([+-]?\d+(?:\.\d+)?)/i);
        if (latLabel && lonLabel) {
          const lat = Number(latLabel[1]);
          const lon = Number(lonLabel[1]);
          if (lat >= -90 && lat <= 90 && lon >= -180 && lon <= 180) return { lat, lon };
        }

        // DMS / cardinal formats, e.g. 41°47'50"N 88°10'12"W.
        const dmsLat = raw.match(/(\d{1,2})(?:\s*°|\s+)\s*(\d{1,2})?(?:\s*'|\s+)\s*(\d{1,2}(?:\.\d+)?)?\s*"?\s*([NS])/i);
        const dmsLon = raw.match(/(\d{1,3})(?:\s*°|\s+)\s*(\d{1,2})?(?:\s*'|\s+)\s*(\d{1,2}(?:\.\d+)?)?\s*"?\s*([EW])/i);
        if (dmsLat && dmsLon) {
          const lat = dmsToDecimal(dmsLat[1], dmsLat[2], dmsLat[3], dmsLat[4]);
          const lon = dmsToDecimal(dmsLon[1], dmsLon[2], dmsLon[3], dmsLon[4]);
          if (lat >= -90 && lat <= 90 && lon >= -180 && lon <= 180) return { lat, lon };
        }

        // Decimal coordinates with cardinal directions, e.g. 41.7972 N, 88.1700 W.
        const cardinalLat = raw.match(/([+-]?\d+(?:\.\d+)?)\s*°?\s*([NS])/i);
        const cardinalLon = raw.match(/([+-]?\d+(?:\.\d+)?)\s*°?\s*([EW])/i);
        if (cardinalLat && cardinalLon) {
          let lat = Math.abs(Number(cardinalLat[1])) * (/S/i.test(cardinalLat[2]) ? -1 : 1);
          let lon = Math.abs(Number(cardinalLon[1])) * (/W/i.test(cardinalLon[2]) ? -1 : 1);
          if (lat >= -90 && lat <= 90 && lon >= -180 && lon <= 180) return { lat, lon };
        }

        // Plain decimals tolerate commas, spaces, semicolons, parentheses, and pasted map formats.
        const nums = raw.match(/[+-]?\d+(?:\.\d+)?/g);
        if (!nums || nums.length < 2) throw new Error("Coordinates need a latitude and longitude.");
        let lat = Number(nums[0]);
        let lon = Number(nums[1]);

        // If someone pastes longitude first and it is obvious from the ranges, fix it automatically.
        if (Math.abs(lat) > 90 && Math.abs(lon) <= 90) [lat, lon] = [lon, lat];

        // Honor N/S/E/W anywhere in a simple decimal pair.
        const upper = raw.toUpperCase();
        if (upper.includes("N")) lat = Math.abs(lat);
        if (upper.includes("S")) lat = -Math.abs(lat);
        if (upper.includes("E")) lon = Math.abs(lon);
        if (upper.includes("W")) lon = -Math.abs(lon);

        if (!Number.isFinite(lat) || !Number.isFinite(lon) ||
            lat < -90 || lat > 90 || lon < -180 || lon > 180) {
          throw new Error("Coordinates are out of range.");
        }
        return { lat, lon };
      }

      function formatCoordinates(coords) {
        return coords.lat.toFixed(5) + ", " + coords.lon.toFixed(5);
      }

      function formatSolarTime(value) {
        const match = String(value || "").match(/T(\d{2}):(\d{2})/);
        if (!match) return "--:--";

        const hour24 = Number(match[1]);
        const minute = match[2];
        const suffix = hour24 >= 12 ? "PM" : "AM";
        const hour12 = hour24 % 12 || 12;
        return hour12 + ":" + minute + " " + suffix;
      }

      function renderSunTimes(data) {
        sunriseTime.textContent = formatSolarTime(data?.sunrise);
        sunsetTime.textContent = formatSolarTime(data?.sunset);

      async function fetchSunTimes(lat, lon) {
        const params = new URLSearchParams({
          latitude: String(lat),
          longitude: String(lon),
          daily: "sunrise,sunset",
          timezone: "auto",
          forecast_days: "1"
        });

        const res = await fetch(
          "https://api.open-meteo.com/v1/forecast?" + params.toString(),
          { cache: "no-store" }
        );
        if (!res.ok) throw new Error("Sunrise/sunset unavailable.");

        const data = await res.json();
        return {
          sunrise: data?.daily?.sunrise?.[0] || null,
          sunset: data?.daily?.sunset?.[0] || null,
          timezone: data?.timezone || null
        };
      }

      async function fetchOpenMeteoWeather(lat, lon, source) {
        const params = new URLSearchParams({
          latitude: String(lat),
          longitude: String(lon),
          current: "temperature_2m,weather_code",
          daily: "weather_code,temperature_2m_max,temperature_2m_min",
          temperature_unit: "fahrenheit",
          timezone: "auto",
          forecast_days: "4"
        });

        let endpoint = "https://api.open-meteo.com/v1/forecast";
        if (source === "nbm") {
          endpoint = "https://api.open-meteo.com/v1/gfs";
          params.set("models", "nbm_conus");
        } else if (source === "gfs") {
          endpoint = "https://api.open-meteo.com/v1/gfs";
          params.set("models", "gfs_seamless");
        } else if (source === "ecmwf") {
          endpoint = "https://api.open-meteo.com/v1/ecmwf";
        }

        const wxRes = await fetch(endpoint + "?" + params.toString());
        if (!wxRes.ok) throw new Error("Selected weather source is unavailable right now.");
        const data = await wxRes.json();

        if (!data.current || !data.daily) {
          throw new Error("Selected weather source did not return a complete forecast.");
        }
        return data;
      }

      function googleWeatherCode(type) {
        const value = String(type || "").toUpperCase();
        if (/THUNDER|STORM/.test(value)) return 95;
        if (/SNOW|SLEET|ICE|FREEZ/.test(value)) return 71;
        if (/RAIN|SHOWER|DRIZZLE|HAIL/.test(value)) return 61;
        if (/FOG|HAZE|MIST/.test(value)) return 45;
        if (/PARTLY|MOSTLY_CLEAR|MOSTLY_SUNNY/.test(value)) return 2;
        if (/CLOUD|OVERCAST/.test(value)) return 3;
        if (/CLEAR|SUNNY/.test(value)) return 0;
        return 3;
      }

      async function fetchGoogleWeather(lat, lon, apiKey) {
        const key = String(apiKey || "").trim();
        if (!key) throw new Error("Google Weather needs an API key.");

        const common = new URLSearchParams({
          key,
          "location.latitude": String(lat),
          "location.longitude": String(lon),
          unitsSystem: "IMPERIAL"
        });

        const dailyParams = new URLSearchParams(common);
        dailyParams.set("days", "4");
        dailyParams.set("pageSize", "4");

        const [currentRes, dailyRes] = await Promise.all([
          fetch("https://weather.googleapis.com/v1/currentConditions:lookup?" + common.toString()),
          fetch("https://weather.googleapis.com/v1/forecast/days:lookup?" + dailyParams.toString())
        ]);

        if (!currentRes.ok || !dailyRes.ok) {
          let detail = "";
          try {
            const body = !currentRes.ok ? await currentRes.json() : await dailyRes.json();
            detail = body?.error?.message ? " " + body.error.message : "";
          } catch {}
          throw new Error("Google Weather is unavailable." + detail);
        }

        const currentData = await currentRes.json();
        const dailyData = await dailyRes.json();
        const days = (dailyData.forecastDays || []).slice(0, 4);
        if (!currentData.temperature || !days.length) {
          throw new Error("Google Weather returned an incomplete forecast.");
        }

        return {
          timezone: currentData.timeZone?.id || dailyData.timeZone?.id || timezone,
          current: {
            temperature_2m: Number(currentData.temperature.degrees),
            weather_code: googleWeatherCode(currentData.weatherCondition?.type)
          },
          daily: {
            time: days.map(day => {
              const d = day.displayDate || {};
              return String(d.year).padStart(4, "0") + "-" +
                String(d.month).padStart(2, "0") + "-" +
                String(d.day).padStart(2, "0");
            }),
            temperature_2m_max: days.map(day => Number(day.maxTemperature?.degrees)),
            temperature_2m_min: days.map(day => Number(day.minTemperature?.degrees)),
            weather_code: days.map(day =>
              googleWeatherCode(
                day.daytimeForecast?.weatherCondition?.type ||
                day.nighttimeForecast?.weatherCondition?.type
              )
            )
          }
        };
      }

      function nwsKind(text) {
        const value = String(text || "").toLowerCase();
        if (/thunder|t-storm|storm/.test(value)) return "storm";
        if (/snow|sleet|ice|freezing/.test(value)) return "snow";
        if (/rain|shower|drizzle/.test(value)) return "rain";
        if (/fog|haze|mist/.test(value)) return "fog";
        if (/partly|mostly sunny|mostly clear/.test(value)) return "partly";
        if (/cloud|overcast/.test(value)) return "cloud";
        if (/sunny|clear/.test(value)) return "sun";
        return "cloud";
      }

      function nwsCodeFromText(text) {
        const kind = nwsKind(text);
        return {
          sun: 0,
          partly: 2,
          cloud: 3,
          fog: 45,
          rain: 61,
          snow: 71,
          storm: 95
        }[kind] ?? 3;
      }

      function dateInTimezone(value, tz) {
        return new Intl.DateTimeFormat("en-CA", {
          timeZone: tz,
          year: "numeric",
          month: "2-digit",
          day: "2-digit"
        }).format(new Date(value));
      }

      async function fetchNwsWeather(lat, lon) {
        const headers = { Accept: "application/geo+json" };
        const pointRes = await fetch(
          "https://api.weather.gov/points/" + lat.toFixed(5) + "," + lon.toFixed(5),
          { headers, cache: "no-store" }
        );
        if (!pointRes.ok) throw new Error("National Weather Service is unavailable right now.");
        const pointData = await pointRes.json();
        const props = pointData.properties || {};
        if (!props.forecast || !props.forecastHourly) {
          throw new Error("National Weather Service has no forecast for these coordinates.");
        }

        const [forecastRes, hourlyRes] = await Promise.all([
          fetch(props.forecast, { headers, cache: "no-store" }),
          fetch(props.forecastHourly, { headers, cache: "no-store" })
        ]);
        if (!forecastRes.ok || !hourlyRes.ok) {
          throw new Error("National Weather Service forecast is unavailable right now.");
        }

        const forecastData = await forecastRes.json();
        const hourlyData = await hourlyRes.json();
        const periods = forecastData.properties?.periods || [];
        const hourlyPeriods = hourlyData.properties?.periods || [];
        const currentPeriod = hourlyPeriods[0] || periods[0];
        const nwsTimezone = props.timeZone || timezone;
        if (!currentPeriod) throw new Error("National Weather Service returned no forecast periods.");

        const grouped = new Map();
        periods.forEach(period => {
          const date = dateInTimezone(period.startTime, nwsTimezone);
          if (!grouped.has(date)) grouped.set(date, { time: date, high: null, low: null, code: null });
          const day = grouped.get(date);
          if (period.isDaytime) {
            day.high = period.temperature;
            day.code = nwsCodeFromText(period.shortForecast);
          } else {
            day.low = period.temperature;
            if (day.code == null) day.code = nwsCodeFromText(period.shortForecast);
          }
        });

        const days = Array.from(grouped.values()).slice(0, 4);
        // Fill an occasional missing high/low at the edge of the NWS 12-hour period list.
        for (let i = 0; i < days.length; i++) {
          if (days[i].high == null) days[i].high = days[i - 1]?.high ?? currentPeriod.temperature;
          if (days[i].low == null) days[i].low = days[i + 1]?.low ?? days[i].high;
          if (days[i].code == null) days[i].code = nwsCodeFromText(currentPeriod.shortForecast);
        }

        return {
          timezone: nwsTimezone,
          current: {
            temperature_2m: Number(currentPeriod.temperature),
            weather_code: nwsCodeFromText(currentPeriod.shortForecast)
          },
          daily: {
            time: days.map(day => day.time),
            temperature_2m_max: days.map(day => Number(day.high)),
            temperature_2m_min: days.map(day => Number(day.low)),
            weather_code: days.map(day => day.code)
          }
        };
      }

      function median(values) {
        const nums = values.filter(Number.isFinite).sort((a, b) => a - b);
        if (!nums.length) return NaN;
        const mid = Math.floor(nums.length / 2);
        return nums.length % 2 ? nums[mid] : (nums[mid - 1] + nums[mid]) / 2;
      }

      function canonicalCode(kind) {
        return {
          sun: 0,
          partly: 2,
          cloud: 3,
          fog: 45,
          rain: 61,
          snow: 71,
          storm: 95
        }[kind] ?? 3;
      }

      function consensusWeatherCode(codes) {
        const kinds = codes.filter(Number.isFinite).map(weatherKind);
        if (!kinds.length) return 3;
        const counts = new Map();
        kinds.forEach(kind => counts.set(kind, (counts.get(kind) || 0) + 1));
        const priority = ["storm", "snow", "rain", "fog", "partly", "cloud", "sun"];
        let best = kinds[0];
        let bestCount = 0;
        priority.forEach(kind => {
          const count = counts.get(kind) || 0;
          if (count > bestCount) {
            best = kind;
            bestCount = count;
          }
        });
        return canonicalCode(best);
      }

      function distanceKm(lat1, lon1, lat2, lon2) {
        const toRad = value => value * Math.PI / 180;
        const earthKm = 6371;
        const dLat = toRad(lat2 - lat1);
        const dLon = toRad(lon2 - lon1);
        const a =
          Math.sin(dLat / 2) ** 2 +
          Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
          Math.sin(dLon / 2) ** 2;
        return earthKm * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      }

      async function fetchNwsObservation(lat, lon) {
        const headers = { Accept: "application/geo+json" };
        const pointRes = await fetch(
          "https://api.weather.gov/points/" + lat.toFixed(4) + "," + lon.toFixed(4),
          { headers }
        );
        if (!pointRes.ok) throw new Error("NWS observation lookup failed.");
        const pointData = await pointRes.json();
        const props = pointData.properties || {};

        let stationsUrl = props.observationStations;
        if (!stationsUrl && props.gridId != null && props.gridX != null && props.gridY != null) {
          stationsUrl = "https://api.weather.gov/gridpoints/" +
            props.gridId + "/" + props.gridX + "," + props.gridY + "/stations";
        }
        if (!stationsUrl) throw new Error("No nearby NWS observation stations.");

        const stationsRes = await fetch(stationsUrl, { headers });
        if (!stationsRes.ok) throw new Error("NWS station list unavailable.");
        const stationsData = await stationsRes.json();

        const stations = (stationsData.features || [])
          .map(feature => {
            const stationUrl = feature.id || feature.properties?.["@id"];
            const coords = feature.geometry?.coordinates || [];
            const stationLon = Number(coords[0]);
            const stationLat = Number(coords[1]);
            if (!stationUrl || !Number.isFinite(stationLat) || !Number.isFinite(stationLon)) return null;
            return {
              url: stationUrl,
              distance: distanceKm(lat, lon, stationLat, stationLon)
            };
          })
          .filter(Boolean)
          .sort((a, b) => a.distance - b.distance)
          .slice(0, 8);

        if (!stations.length) throw new Error("No nearby NWS observation stations.");

        // Walk outward from the exact coordinates and take the closest station
        // with a fresh, usable observation. Do not average distant stations.
        for (const station of stations) {
          try {
            const obsRes = await fetch(
              station.url.replace(/\/$/, "") + "/observations/latest",
              { headers }
            );
            if (!obsRes.ok) continue;

            const obsData = await obsRes.json();
            const p = obsData.properties || {};
            const celsius = Number(p.temperature?.value);
            if (!Number.isFinite(celsius)) continue;

            const timestamp = p.timestamp ? new Date(p.timestamp).getTime() : 0;
            const ageMinutes = timestamp ? Math.max(0, (Date.now() - timestamp) / 60000) : 999;
            if (ageMinutes > 90) continue;

            return {
              temperature_2m: celsius * 9 / 5 + 32,
              weather_code: p.textDescription ? nwsCodeFromText(p.textDescription) : null,
              timestamp,
              stationDistanceKm: station.distance
            };
          } catch {}
        }

        throw new Error("No fresh nearby NWS observation.");
      }

      function blendForecastDatasets(datasets) {
        const usable = datasets.filter(Boolean);
        if (!usable.length) throw new Error("No forecast data available.");

        const dates = [];
        usable.forEach(data => {
          (data.daily?.time || []).forEach(date => {
            if (!dates.includes(date)) dates.push(date);
          });
        });
        dates.sort();
        const firstFour = dates.slice(0, 4);

        const pickForDate = (data, date, key) => {
          const i = data.daily?.time?.indexOf(date) ?? -1;
          return i >= 0 ? Number(data.daily[key]?.[i]) : NaN;
        };

        return {
          timezone: usable.find(data => data.timezone)?.timezone || timezone,
          current: {
            temperature_2m: median(usable.map(data => Number(data.current?.temperature_2m))),
            weather_code: consensusWeatherCode(usable.map(data => Number(data.current?.weather_code)))
          },
          daily: {
            time: firstFour,
            temperature_2m_max: firstFour.map(date =>
              median(usable.map(data => pickForDate(data, date, "temperature_2m_max")))
            ),
            temperature_2m_min: firstFour.map(date =>
              median(usable.map(data => pickForDate(data, date, "temperature_2m_min")))
            ),
            weather_code: firstFour.map(date =>
              consensusWeatherCode(usable.map(data => pickForDate(data, date, "weather_code")))
            )
          }
        };
      }

      async function fetchPhoneMatchWeather(lat, lon) {
        // Use NOAA's National Blend of Models directly at the exact coordinates.
        // This avoids airport-station cold/warm pockets and is much closer to the
        // interpolated current/high/low values consumer phone weather apps use.
        try {
          return await fetchOpenMeteoWeather(lat, lon, "nbm");
        } catch {}

        // Keep a model-based exact-coordinate fallback before falling back to NWS.
        try {
          return await fetchOpenMeteoWeather(lat, lon, "best_match");
        } catch {}

        return fetchNwsWeather(lat, lon);
      }

      async function fetchWeather(coordinateText, source = settings.weatherSource || DEFAULTS.weatherSource) {
        const location = parseCoordinates(coordinateText);
        locationName = formatCoordinates(location);

        let data = source === "nws"
          ? await fetchNwsWeather(location.lat, location.lon)
          : source === "google"
            ? await fetchGoogleWeather(location.lat, location.lon, settings.googleWeatherApiKey)
            : await fetchOpenMeteoWeather(location.lat, location.lon, source);

        // Keep model sources interpolated at the exact coordinates. Airport station
        // observations can differ by several degrees from neighborhood conditions.

        if (data.timezone) timezone = data.timezone;

        try {
          const sun = await fetchSunTimes(location.lat, location.lon);
          renderSunTimes(sun);
          if (!data.timezone && sun.timezone) timezone = sun.timezone;
        } catch {
          // Keep the last good sun times if this lightweight request ever fails.
        }

        renderForecast(data);
        updateClock();
        return data;
      }

      async function refreshWeather({ quiet = false } = {}) {
        const selectedSource = settings.weatherSource || DEFAULTS.weatherSource;
        try {
          await fetchWeather(settings.coordinates, selectedSource);
          if (!quiet) showStatus("Weather updated");
        } catch (error) {
          // Other providers fall back to NWS. If NWS itself is selected and unavailable,
          // do not silently substitute a different model under the NWS label.
          if (selectedSource !== "nws") {
            try {
              await fetchWeather(settings.coordinates, "nws");
              const selectedLabel = WEATHER_SOURCES[selectedSource]?.label || "Selected source";
              metaEl.textContent = locationName + " • " + selectedLabel + " unavailable; showing NOAA / National Weather Service";
              if (!quiet) showStatus(selectedLabel + " unavailable — using NWS");
              return;
            } catch {}
          }

          renderWeatherFallback();
          metaEl.textContent = error.message || "Could not load weather.";
          if (!quiet) showStatus(error.message || "Could not load weather");
        }
      }

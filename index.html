      }

      musicButton.addEventListener("click", () => {
        musicSelect.classList.toggle("open");
        weatherSourceSelect.classList.remove("open");
        backgroundSelect.classList.remove("open");
        animationSelect.classList.remove("open");
        fontSelect.classList.remove("open");
      });

      musicMenu.addEventListener("click", e => {
        const add = e.target.closest("[data-add-music]");
        if (add) {
          e.stopPropagation();
          openMusicEditor();
          return;
        }

        const edit = e.target.closest("[data-edit-music-id]");
        if (edit) {
          e.stopPropagation();
          const item = settings.music.find(track => track.id === edit.dataset.editMusicId);
          if (item) openMusicEditor(item);
          return;
        }

        const remove = e.target.closest("[data-remove-music-id]");
        if (remove) {
          e.stopPropagation();
          const id = remove.dataset.removeMusicId;
          settings.music = settings.music.filter(item => item.id !== id);
          if (settings.selectedMusicId === id) settings.selectedMusicId = "";
          persistSettings();
          renderMusicPicker({ animateRows: true });
          applySelectedMusic(true);
          updateSharedPresets(data => {
            data.music = data.music.filter(item => item.id !== id);
            return data;
          }, "Music removed everywhere");
          return;
        }

        if (e.target.closest("[data-music-none]")) {
          setSelectedMusic("");
          musicSelect.classList.remove("open");
          return;
        }

        const option = e.target.closest("[data-music-id]");
        if (!option) return;
        setSelectedMusic(option.dataset.musicId);
        musicSelect.classList.remove("open");
      });

      cancelMusicButton.addEventListener("click", () => {
        editingMusicId = null;
        musicEditor.classList.remove("open");
      });

      confirmMusicButton.addEventListener("click", () => {
        const name = musicNameInput.value.trim();
        const url = musicUrlInput.value.trim();

        if (!name) {
          showStatus("Give the music a name");
          musicNameInput.focus();
          return;
        }
        if (!youtubeVideoId(url)) {
          showStatus("Use a valid YouTube URL");
          musicUrlInput.focus();
          return;
        }

        if (editingMusicId) {
          const index = settings.music.findIndex(item => item.id === editingMusicId);
          if (index >= 0) settings.music[index] = { ...settings.music[index], name, url };
        } else {
          const item = { id: makePresetId("music"), name, url };
          settings.music.push(item);
          settings.selectedMusicId = item.id;
        }

        const savedMusic = settings.music.find(item =>
          item.id === (editingMusicId || settings.selectedMusicId)
        );
        persistSettings();
        renderMusicPicker({ animateRows: true });
        applySelectedMusic(true);
        musicEditor.classList.remove("open");
        updateSharedPresets(data => {
          const index = data.music.findIndex(item => item.id === savedMusic.id);
          if (index >= 0) data.music[index] = { ...savedMusic };
          else data.music.push({ ...savedMusic });
          return data;
        }, editingMusicId ? "Music updated everywhere" : "Music added everywhere");
        editingMusicId = null;
      });

      settingsEl.addEventListener("click", e => {
        if (e.target === settingsEl) closeSettings();
      });

      document.addEventListener("click", e => {
        if (!weatherSourceSelect.contains(e.target)) weatherSourceSelect.classList.remove("open");
        if (!backgroundSelect.contains(e.target)) backgroundSelect.classList.remove("open");
        if (!musicSelect.contains(e.target)) musicSelect.classList.remove("open");
        if (!animationSelect.contains(e.target)) animationSelect.classList.remove("open");
        if (!fontSelect.contains(e.target)) fontSelect.classList.remove("open");
      });

      document.addEventListener("keydown", e => {
        if (e.key === "Escape") {
          weatherSourceSelect.classList.remove("open");
          backgroundSelect.classList.remove("open");
            musicSelect.classList.remove("open");
          animationSelect.classList.remove("open");
          fontSelect.classList.remove("open");
          if (backgroundEditor.classList.contains("open")) {
            backgroundEditor.classList.remove("open");
          } else if (musicEditor.classList.contains("open")) {
            musicEditor.classList.remove("open");
          } else {
            closeSettings();
          }
        }

        if (e.key === "Shift" && !e.repeat) {
          const now = performance.now();
          if (now - lastShiftPress <= 450) {
            const willShow = !settingsButton.classList.contains("visible");
            settingsButton.classList.toggle("visible", willShow);
            if (!willShow) closeSettings();
            lastShiftPress = 0;
          } else {
            lastShiftPress = now;
          }
        }
      });

      async function saveCoordinatesNow({ notify = false } = {}) {
        let coords;
        try {
          coords = parseCoordinates(coordinatesInput.value);
        } catch {
          return false;
        }

        const formatted = formatCoordinates(coords);
        settings.coordinates = formatted;
        persistSettings();

        if (coordinatesInput.value.trim() !== formatted) {
          coordinatesInput.value = formatted;
        }

        await refreshWeather({ quiet: true });
        if (notify) showStatus("Location saved");
        return true;
      }

      coordinatesInput.addEventListener("input", () => {
        clearTimeout(coordinateSaveTimer);
        coordinateSaveTimer = setTimeout(() => saveCoordinatesNow(), 650);
      });
      coordinatesInput.addEventListener("blur", () => {
        clearTimeout(coordinateSaveTimer);
        saveCoordinatesNow();
      });
      coordinatesInput.addEventListener("keydown", e => {
        if (e.key === "Enter") {
          clearTimeout(coordinateSaveTimer);
          saveCoordinatesNow({ notify: true });
          coordinatesInput.blur();
        }
      });

      googleWeatherKeyInput.addEventListener("input", () => {
        clearTimeout(googleKeySaveTimer);
        googleKeySaveTimer = setTimeout(async () => {
          settings.googleWeatherApiKey = googleWeatherKeyInput.value.trim();
          persistSettings();
          if (settings.weatherSource === "google" && settings.googleWeatherApiKey) {
            await refreshWeather({ quiet: true });
          }
        }, 550);
      });
      googleWeatherKeyInput.addEventListener("blur", async () => {
        clearTimeout(googleKeySaveTimer);
        settings.googleWeatherApiKey = googleWeatherKeyInput.value.trim();
        persistSettings();
        if (settings.weatherSource === "google" && settings.googleWeatherApiKey) {
          await refreshWeather({ quiet: true });
        }
      });

      // Initial paint. Background/music lists are shared through one anonymous
      // public JSON store; each device keeps only its current selections locally.
      await bootstrapSharedPresets();
      applyFont();
      applyDisplaySize(100);
      syncBackgroundModeUI();
      renderBackgroundPicker();
      applySelectedBackground({ fade: false });
      renderMusicPicker();
      applySelectedMusic();
      renderWeatherFallback();
      scheduleClockTick();
      refreshWeather({ quiet: true });

      // If the browser blocks audible autoplay, the first real user gesture re-arms it.
      let musicUnlocked = false;
      const unlockMusic = () => {
        if (musicUnlocked) return;
        musicUnlocked = true;
        if (settings.selectedMusicId) applySelectedMusic(true);
      };
      document.addEventListener("pointerdown", unlockMusic, { once: true, passive: true });
      document.addEventListener("keydown", unlockMusic, { once: true });

      // Pull shared presets again when this display becomes active, plus periodically.
      const refreshSharedLists = async () => {
        const beforeBackground = selectedBackground();
        const beforeBackgroundKey = beforeBackground
          ? beforeBackground.type + ":" + beforeBackground.url
          : "none";
        const beforeRotateIds = JSON.stringify(rotatingBackgroundIds());
        const beforeMusic = selectedMusic();
        const beforeMusicKey = beforeMusic ? beforeMusic.url : "none";

        const changed = await loadSharedPresets();
        if (changed) {
          renderBackgroundPicker();
          renderMusicPicker();

          const afterBackground = selectedBackground();
          const afterBackgroundKey = afterBackground
            ? afterBackground.type + ":" + afterBackground.url
            : "none";
          const afterRotateIds = JSON.stringify(rotatingBackgroundIds());

          if (afterRotateIds !== beforeRotateIds) {
            resetBackgroundShuffle();
            scheduleBackgroundCycle();
          }

          if (afterBackgroundKey !== beforeBackgroundKey) {
            applySelectedBackground({ fade: true });
          }

          const afterMusic = selectedMusic();
          const afterMusicKey = afterMusic ? afterMusic.url : "none";
          if (afterMusicKey !== beforeMusicKey) {
            applySelectedMusic();
          }
        }
      };
      window.addEventListener("focus", refreshSharedLists);
      document.addEventListener("visibilitychange", () => {
        if (!document.hidden) refreshSharedLists();
      });
      setInterval(refreshSharedLists, 30 * 1000);

      // Clock ticks are aligned to the next real second; weather refreshes every 5 minutes.
      setInterval(() => refreshWeather({ quiet: true }), 5 * 60 * 1000);
    })();
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#111111" />
  <title>DAQ Board</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      --text: rgba(255,255,255,.97);
      --muted: rgba(255,255,255,.72);
      --line: rgba(255,255,255,.28);
      --pill: rgba(215,215,220,.42);
      --panel: rgba(20,22,28,.86);
    }
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #050505;
    }
    body {
      display: grid;
      place-items: center;
    }
    button, input {
      font: inherit;
    }

    /* The dashboard itself always remains 16:9 and letterboxes on other screens. */
    #board {
      position: relative;
      width: min(100vw, 177.777777vh);
      height: min(100vh, 56.25vw);
      overflow: hidden;
      isolation: isolate;
      background: #222 center / cover no-repeat;
      color: var(--text);
      text-shadow: 0 1px 3px rgba(0,0,0,.18);
    }
    #youtube-background {
      position: absolute;
      inset: 0;
      z-index: 0;
      display: none;
      overflow: hidden;
      background: #000;
      pointer-events: none;
    }
    #youtube-background.active { display: block; }
    #youtube-background iframe {
      position: absolute;
      inset: -1%;
      width: 102%;
      height: 102%;
      border: 0;
      pointer-events: none;
    }
    #board::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 1;
      background:
        linear-gradient(180deg, rgba(10,12,18,.22), rgba(10,12,18,.12) 55%, rgba(10,12,18,.18));
      pointer-events: none;
    }

    .clock-block {
      position: absolute;
      z-index: 2;
      left: 9.8%;
      top: 19.4%;
      width: 44%;
      user-select: none;
    }
    .time-row {
      display: flex;
      align-items: flex-start;
      gap: .1em;
      line-height: .78;
      white-space: nowrap;
      font-weight: 200;
      letter-spacing: -.055em;
    }
    #clock-main {
      font-size: clamp(76px, 8.2vw, 158px);
    }
    #clock-seconds {
      margin-top: .02em;
      font-size: clamp(34px, 3.35vw, 68px);
      font-weight: 300;
      letter-spacing: -.04em;
    }
    #date-line {
      margin-top: 4.6%;
      font-size: clamp(24px, 2.05vw, 40px);
      font-weight: 400;
      letter-spacing: -.02em;
    }

    .weather-block {
      position: absolute;
      z-index: 2;
      right: 9.6%;
      top: 17.8%;
      width: 28%;
      min-width: 390px;
      user-select: none;
    }
    .current-weather {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 14px;
      min-height: 84px;
      padding-right: 1%;
    }
    #current-temp {
      font-size: clamp(46px, 4.2vw, 82px);
      font-weight: 300;
      letter-spacing: -.05em;
      line-height: 1;
    }
    #current-icon {
      width: clamp(62px, 4.75vw, 92px);
      height: clamp(62px, 4.75vw, 92px);
      display: grid;
      place-items: center;
    }

    #forecast {
      margin-top: 6.8%;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      align-items: start;
    }
    .day {
      text-align: center;
      min-width: 0;
    }
    .day-label {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 74px;
      height: 33px;
      padding: 0 13px;
      border-radius: 999px;
      background: var(--pill);
      font-size: clamp(16px, 1.07vw, 22px);
      font-weight: 650;
      line-height: 1;
      text-shadow: none;
      letter-spacing: .01em;
    }
    .day-icon {
      width: clamp(46px, 3.1vw, 62px);
      height: clamp(46px, 3.1vw, 62px);
      display: grid;
      place-items: center;
      margin: 8px auto 0;
    }
    .temps {
      margin-top: 0;
      display: flex;
      justify-content: center;
      gap: 13px;
      font-size: clamp(19px, 1.35vw, 27px);
      line-height: 1;
      font-weight: 400;
    }
    .temps span:last-child { opacity: .9; }

    .divider {
      position: absolute;
      z-index: 2;
      left: 9.8%;
      right: 9.8%;
      top: 50.7%;
      height: 1px;
      background: var(--line);
      box-shadow: 0 1px rgba(0,0,0,.08);
    }

    #settings-button {
      position: absolute;
      top: 1.1%;
      right: .7%;
      width: clamp(39px, 2.4vw, 48px);
      height: clamp(39px, 2.4vw, 48px);
      border: 0;
      border-radius: 999px;
      display: grid;
      place-items: center;
      cursor: pointer;
      color: #34404d;
      background: rgba(242,242,242,.82);
      box-shadow: 0 2px 8px rgba(0,0,0,.18);
      transition:
        opacity .18s ease,
        transform .22s cubic-bezier(.2,.9,.25,1.25),
        background .16s ease,
        visibility 0s linear .22s;
      z-index: 5;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transform: scale(.72) rotate(-14deg);
    }
    #settings-button.visible {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transform: scale(1) rotate(0deg);
      transition:
        opacity .18s ease,
        transform .22s cubic-bezier(.2,.9,.25,1.25),
        background .16s ease,
        visibility 0s;
    }
    #settings-button.visible:hover {
      transform: scale(1.06) rotate(0deg);
      background: rgba(255,255,255,.95);
    }
    #settings-button svg {
      width: 58%;
      height: 58%;
      fill: currentColor;
    }

    #settings {
      position: absolute;
      inset: 0;
      z-index: 20;
      display: flex;
      align-items: flex-start;
      justify-content: flex-end;
      padding: 4.9% 1.1% 0 0;
      background: rgba(0,0,0,0);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition:
        opacity .18s ease,
        background .22s ease,
        visibility 0s linear .24s;
    }
    #settings.open {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      background: rgba(0,0,0,.16);
      transition:
        opacity .18s ease,
        background .22s ease,
        visibility 0s;
    }
    .settings-card {
      width: min(440px, 34vw);
      min-width: 350px;
      max-height: 88%;
      overflow-y: auto;
      padding: 22px;
      opacity: 0;
      transform: translateY(-10px) scale(.985);
      transform-origin: top right;
      transition:
        opacity .18s ease,
        transform .24s cubic-bezier(.2,.85,.3,1.08);
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 18px;
      background: var(--panel);
      box-shadow: 0 18px 50px rgba(0,0,0,.34);
      backdrop-filter: blur(18px);
      text-shadow: none;
    }
    #settings.open .settings-card {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
    .settings-title {
      font-size: 21px;
      font-weight: 700;
      margin-bottom: 18px;
    }
    .field {
      margin-top: 15px;
    }
    .field label {
      display: block;
      margin-bottom: 7px;
      font-size: 13px;
      color: rgba(255,255,255,.72);
      font-weight: 600;
    }
    .field input {
      width: 100%;
      height: 42px;
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 10px;
      padding: 0 12px;
      outline: none;
      color: white;
      background: rgba(255,255,255,.08);
    }
    .field input:focus {
      border-color: rgba(255,255,255,.48);
      background: rgba(255,255,255,.11);
    }

    .field-label-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 7px;
    }
    .field-label-row label {
      margin: 0;
    }
    .icon-button {
      width: 27px;
      height: 27px;
      padding: 0;
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 8px;
      display: grid;
      place-items: center;
      cursor: pointer;
      color: rgba(255,255,255,.88);
      background: rgba(255,255,255,.08);
      font-size: 20px;
      line-height: 1;
    }
    .icon-button:hover { background: rgba(255,255,255,.15); }

    .custom-select {
      position: relative;
      width: 100%;
    }
    .custom-select-button {
      width: 100%;
      min-height: 42px;
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 10px;
      padding: 0 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      cursor: pointer;
      color: white;
      background: rgba(255,255,255,.08);
      text-align: left;
    }
    .custom-select-button:hover,
    .custom-select.open .custom-select-button {
      border-color: rgba(255,255,255,.34);
      background: rgba(255,255,255,.11);
    }
    .chevron {
      width: 8px;
      height: 8px;
      flex: 0 0 auto;
      border-right: 2px solid rgba(255,255,255,.78);
      border-bottom: 2px solid rgba(255,255,255,.78);
      transform: rotate(45deg) translateY(-2px);
      transition: transform .15s ease;
    }
    .custom-select.open .chevron {
      transform: rotate(225deg) translate(-2px,-2px);
    }
    .custom-select-menu {
      display: none;
      margin-top: 6px;
      padding: 5px;
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 11px;
      background: rgba(30,32,39,.98);
      box-shadow: 0 12px 30px rgba(0,0,0,.34);
    }
    .custom-select.open .custom-select-menu { display: block; }
    .custom-option {
      width: 100%;
      min-height: 38px;
      border: 0;
      border-radius: 8px;
      padding: 0 10px;
      display: flex;
      align-items: center;
      cursor: pointer;
      color: rgba(255,255,255,.88);
      background: transparent;
      text-align: left;
    }
    .custom-option:hover { background: rgba(255,255,255,.10); }
    .custom-option.selected {
      color: #fff;
      background: rgba(255,255,255,.14);
      font-weight: 650;
    }

    .background-button {
      padding: 6px 9px 6px 7px;
      min-height: 52px;
    }
    .background-current {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .background-thumb {
      width: 62px;
      height: 36px;
      flex: 0 0 auto;
      overflow: hidden;
      border-radius: 7px;
      background: rgba(255,255,255,.08) center / cover no-repeat;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.08);
    }
    .background-thumb.video-generic {
      display: grid;
      place-items: center;
      font-size: 15px;
    }
    .background-title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 600;
    }
    #background-menu {
      max-height: 285px;
      overflow-y: auto;
    }
    .background-filter {
      position: sticky;
      top: 0;
      z-index: 2;
      display: flex;
      gap: 6px;
      padding: 4px 3px 7px;
      background: rgba(30,32,39,.98);
    }
    .background-filter button {
      height: 29px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 999px;
      padding: 0 10px;
      cursor: pointer;
      color: rgba(255,255,255,.62);
      background: rgba(255,255,255,.045);
      font-size: 12px;
      font-weight: 650;
      transition: background .14s ease, color .14s ease, border-color .14s ease;
    }
    .background-filter button:hover {
      color: rgba(255,255,255,.9);
      background: rgba(255,255,255,.09);
    }
    .background-filter button.active {
      color: #fff;
      border-color: rgba(255,255,255,.25);
      background: rgba(255,255,255,.16);
    }
    .background-option {
      position: relative;
      width: 100%;
      min-height: 54px;
      border: 0;
      border-radius: 9px;
      padding: 6px 34px 6px 6px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      color: white;
      background: transparent;
      text-align: left;
    }
    .background-option:hover { background: rgba(255,255,255,.10); }
    .background-option.selected { background: rgba(255,255,255,.14); }
    .background-option .remove-background {
      position: absolute;
      top: 50%;
      right: 7px;
      width: 24px;
      height: 24px;
      transform: translateY(-50%);
      border: 0;
      border-radius: 7px;
      display: grid;
      place-items: center;
      opacity: 0;
      cursor: pointer;
      color: rgba(255,255,255,.75);
      background: rgba(0,0,0,.24);
      font-size: 17px;
      transition: opacity .12s ease, background .12s ease;
    }
    .background-option:hover .remove-background { opacity: 1; }
    .background-option .remove-background:hover {
      color: #fff;
      background: rgba(255,80,80,.34);
    }
    .empty-backgrounds {
      padding: 12px 10px;
      color: rgba(255,255,255,.54);
      font-size: 13px;
    }

    .background-editor {
      display: none;
      margin-top: 9px;
      padding: 12px;
      border: 1px solid rgba(255,255,255,.13);
      border-radius: 11px;
      background: rgba(255,255,255,.05);
    }
    .background-editor.open { display: block; }
    .type-toggle {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-bottom: 9px;
    }
    .type-toggle button {
      height: 34px;
      border: 1px solid rgba(255,255,255,.13);
      border-radius: 8px;
      cursor: pointer;
      color: rgba(255,255,255,.75);
      background: rgba(255,255,255,.06);
    }
    .type-toggle button.active {
      color: #fff;
      background: rgba(255,255,255,.16);
      border-color: rgba(255,255,255,.28);
    }
    .background-editor input + input { margin-top: 8px; }
    .background-editor-actions {
      display: flex;
      justify-content: flex-end;
      gap: 7px;
      margin-top: 9px;
    }
    .background-editor-actions button {
      height: 32px;
      border: 1px solid rgba(255,255,255,.13);
      border-radius: 8px;
      padding: 0 11px;
      cursor: pointer;
      color: white;
      background: rgba(255,255,255,.08);
    }
    #confirm-background {
      color: #17191c;
      background: rgba(255,255,255,.92);
      font-weight: 700;
    }

    .field[hidden] { display: none !important; }

    .settings-help {
      margin-top: 8px;
      color: rgba(255,255,255,.55);
      font-size: 12px;
      line-height: 1.45;
    }
    .settings-meta {
      margin-top: 15px;
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(255,255,255,.06);
      color: rgba(255,255,255,.7);
      font-size: 12px;
      line-height: 1.45;
      min-height: 36px;
    }
    .settings-actions {
      display: flex;
      justify-content: flex-end;
      gap: 9px;
      margin-top: 18px;
    }
    .settings-actions button {
      height: 38px;
      border-radius: 9px;
      padding: 0 15px;
      border: 1px solid rgba(255,255,255,.15);
      cursor: pointer;
      color: white;
      background: rgba(255,255,255,.09);
    }
    #save-settings {
      color: #17191c;
      background: rgba(255,255,255,.93);
      border-color: transparent;
      font-weight: 700;
    }
    #status {
      position: absolute;
      left: 50%;
      bottom: 2.4%;
      transform: translateX(-50%) translateY(16px);
      z-index: 30;
      opacity: 0;
      pointer-events: none;
      padding: 9px 14px;
      border-radius: 999px;
      color: #fff;
      background: rgba(15,17,22,.80);
      backdrop-filter: blur(10px);
      font-size: 13px;
      transition: opacity .2s ease, transform .2s ease;
      text-shadow: none;
    }
    #status.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .wx-svg {
      display: block;
      width: 100%;
      height: 100%;
      overflow: visible;
    }
    .wx-stroke {
      stroke: #fff;
      stroke-width: 4.2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .wx-fill { fill: #fff; }

    @media (max-width: 900px), (max-height: 520px) {
      .weather-block { min-width: 0; width: 31%; }
      #forecast { gap: 7px; }
      .day-label { min-width: 56px; height: 26px; padding: 0 8px; }
      .settings-card { min-width: 300px; }
    }
  </style>
</head>
<body>
  <main id="board" aria-label="Dashboard">
    <div id="youtube-background" aria-hidden="true">
      <iframe
        id="youtube-frame"
        title="YouTube background"
        allow="autoplay; encrypted-media"
        referrerpolicy="strict-origin-when-cross-origin"
        tabindex="-1"
      ></iframe>
    </div>

    <section class="clock-block" aria-label="Clock">
      <div class="time-row">
        <span id="clock-main">2:37</span><span id="clock-seconds">31</span>
      </div>
      <div id="date-line">Thursday, October 1</div>
    </section>

    <section class="weather-block" aria-label="Weather">
      <div class="current-weather">
        <div id="current-temp">--°</div>
        <div id="current-icon" aria-hidden="true"></div>
      </div>
      <div id="forecast"></div>
    </section>

    <div class="divider" aria-hidden="true"></div>

    <button id="settings-button" type="button" aria-label="Open settings" title="Settings">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M19.43 12.98c.04-.32.07-.65.07-.98s-.03-.66-.08-.98l2.11-1.65a.51.51 0 0 0 .12-.64l-2-3.46a.5.5 0 0 0-.61-.22l-2.49 1a7.26 7.26 0 0 0-1.69-.98L14.5 2.42A.49.49 0 0 0 14 2h-4a.49.49 0 0 0-.49.42l-.38 2.65c-.61.25-1.17.58-1.69.98l-2.49-1a.5.5 0 0 0-.61.22l-2 3.46a.5.5 0 0 0 .12.64l2.11 1.65c-.05.32-.09.66-.09.98s.03.66.08.98l-2.11 1.65a.51.51 0 0 0-.12.64l2 3.46a.5.5 0 0 0 .61.22l2.49-1c.52.4 1.08.73 1.69.98l.38 2.65A.49.49 0 0 0 10 22h4a.49.49 0 0 0 .49-.42l.38-2.65c.61-.25 1.17-.58 1.69-.98l2.49 1a.5.5 0 0 0 .61-.22l2-3.46a.5.5 0 0 0-.12-.64l-2.11-1.65ZM12 15.5A3.5 3.5 0 1 1 12 8a3.5 3.5 0 0 1 0 7.5Z"/>
      </svg>
    </button>

    <div id="settings" aria-hidden="true">
      <div class="settings-card" role="dialog" aria-modal="true" aria-labelledby="settings-title">
        <div class="settings-title" id="settings-title">Dashboard settings</div>

        <div class="field">
          <label for="coordinates">Coordinates</label>
          <input id="coordinates" type="text" spellcheck="false" autocomplete="off"
            placeholder="41.80803, -88.20902" />
        </div>

        <div class="field">
          <label>Weather source</label>
          <div class="custom-select" id="weather-source-select">
            <button class="custom-select-button" id="weather-source-button" type="button">
              <span id="weather-source-label">Best Match — automatic</span>
              <span class="chevron" aria-hidden="true"></span>
            </button>
            <div class="custom-select-menu" id="weather-source-menu">
              <button class="custom-option" type="button" data-value="best_match">Best Match — automatic</button>
              <button class="custom-option" type="button" data-value="nws">NOAA / National Weather Service</button>
              <button class="custom-option" type="button" data-value="nbm">NOAA NBM — 2.5 km blend</button>
              <button class="custom-option" type="button" data-value="gfs">NOAA HRRR + GFS — seamless</button>
              <button class="custom-option" type="button" data-value="ecmwf">ECMWF IFS — high resolution</button>
              <button class="custom-option" type="button" data-value="google">Google Weather</button>
            </div>
          </div>
        </div>

        <div class="field" id="google-weather-key-field" hidden>
          <label for="google-weather-key">Google Weather API key</label>
          <input id="google-weather-key" type="password" autocomplete="off" spellcheck="false" />
        </div>

        <div class="field">
          <div class="field-label-row">
            <label>Backgrounds</label>
            <button class="icon-button" id="add-background" type="button" aria-label="Add background" title="Add background">+</button>
          </div>

          <div class="custom-select" id="background-select">
            <button class="custom-select-button background-button" id="background-button" type="button">
              <span class="background-current" id="background-current"></span>
              <span class="chevron" aria-hidden="true"></span>
            </button>
            <div class="custom-select-menu" id="background-menu"></div>
          </div>

          <div class="background-editor" id="background-editor">
            <div class="type-toggle">
              <button id="background-type-image" class="active" type="button">Image</button>
              <button id="background-type-video" type="button">Video</button>
            </div>
            <input id="background-name" type="text" maxlength="60" placeholder="Name" />
            <input id="background-new-url" type="url" placeholder="Image or YouTube/video URL" />
            <div class="background-editor-actions">
              <button id="cancel-background" type="button">Cancel</button>
              <button id="confirm-background" type="button">Add</button>
            </div>
          </div>
        </div>

        <div class="field">
          <label>Animation</label>
          <div class="custom-select" id="animation-select">
            <button class="custom-select-button" id="animation-button" type="button">
              <span id="animation-label">Fade</span>
              <span class="chevron" aria-hidden="true"></span>
            </button>
            <div class="custom-select-menu" id="animation-menu">
              <button class="custom-option" type="button" data-value="none">None</button>
              <button class="custom-option" type="button" data-value="fade">Fade</button>
              <button class="custom-option" type="button" data-value="slide">Slide Up</button>
              <button class="custom-option" type="button" data-value="flip">Flip</button>
              <button class="custom-option" type="button" data-value="scale">Soft Scale</button>
            </div>
          </div>
        </div>

        <div id="settings-meta" hidden></div>

        <div class="settings-actions">
          <button id="cancel-settings" type="button">Cancel</button>
          <button id="save-settings" type="button">Save</button>
        </div>
      </div>
    </div>

    <div id="status" role="status" aria-live="polite"></div>
  </main>

  <script>
    (() => {
      const STORAGE_KEY = "daq-board-settings-v1";
      const DEFAULT_BACKGROUND_URL = "https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=2400&q=90";
      const DEFAULTS = {
        coordinates: "41.80803, -88.20902",
        weatherSource: "best_match",
        googleWeatherApiKey: "",
        clockAnimation: "fade",
        backgrounds: [
          { id: "default-image", name: "Mountain Night Sky", type: "image", url: DEFAULT_BACKGROUND_URL }
        ],
        selectedBackgroundId: "default-image"
      };

      const WEATHER_SOURCES = {
        best_match: { label: "Best Match — automatic" },
        nws: { label: "NOAA / National Weather Service" },
        nbm: { label: "NOAA NBM — 2.5 km blend" },
        gfs: { label: "NOAA HRRR + GFS — seamless" },
        ecmwf: { label: "ECMWF IFS — high resolution" },
        google: { label: "Google Weather" }
      };

      const CLOCK_ANIMATIONS = {
        none: "None",
        fade: "Fade",
        slide: "Slide Up",
        flip: "Flip",
        scale: "Soft Scale"
      };

      const board = document.getElementById("board");
      const youtubeBackground = document.getElementById("youtube-background");
      const youtubeFrame = document.getElementById("youtube-frame");
      const clockMain = document.getElementById("clock-main");
      const clockSeconds = document.getElementById("clock-seconds");
      const dateLine = document.getElementById("date-line");
      const currentTemp = document.getElementById("current-temp");
      const currentIcon = document.getElementById("current-icon");
      const forecastEl = document.getElementById("forecast");
      const settingsButton = document.getElementById("settings-button");
      const settingsEl = document.getElementById("settings");
      const coordinatesInput = document.getElementById("coordinates");
      const weatherSourceSelect = document.getElementById("weather-source-select");
      const weatherSourceButton = document.getElementById("weather-source-button");
      const weatherSourceLabel = document.getElementById("weather-source-label");
      const weatherSourceMenu = document.getElementById("weather-source-menu");
      const googleWeatherKeyField = document.getElementById("google-weather-key-field");
      const googleWeatherKeyInput = document.getElementById("google-weather-key");
      const backgroundSelect = document.getElementById("background-select");
      const backgroundButton = document.getElementById("background-button");
      const backgroundCurrent = document.getElementById("background-current");
      const backgroundMenu = document.getElementById("background-menu");
      const addBackgroundButton = document.getElementById("add-background");
      const backgroundEditor = document.getElementById("background-editor");
      const backgroundTypeImage = document.getElementById("background-type-image");
      const backgroundTypeVideo = document.getElementById("background-type-video");
      const backgroundNameInput = document.getElementById("background-name");
      const backgroundNewUrlInput = document.getElementById("background-new-url");
      const cancelBackgroundButton = document.getElementById("cancel-background");
      const confirmBackgroundButton = document.getElementById("confirm-background");
      const animationSelect = document.getElementById("animation-select");
      const animationButton = document.getElementById("animation-button");
      const animationLabel = document.getElementById("animation-label");
      const animationMenu = document.getElementById("animation-menu");

      const saveSettings = document.getElementById("save-settings");
      const cancelSettings = document.getElementById("cancel-settings");
      const statusEl = document.getElementById("status");

      let settings = loadSettings();
      let timezone = Intl.DateTimeFormat().resolvedOptions().timeZone || "UTC";
      let locationName = "";
      let statusTimer = null;
      let lastShiftPress = 0;
      const backgroundTypeFilter = { image: true, video: true };

      function cloneDefaultBackgrounds() {
        return DEFAULTS.backgrounds.map(item => ({ ...item }));
      }

      function loadSettings() {
        try {
          const saved = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
          let backgrounds = Array.isArray(saved.backgrounds)
            ? saved.backgrounds.filter(item => item && item.id && item.url && item.type)
            : [];

          // Migrate the earlier image + YouTube URL settings into presets.
          if (!backgrounds.length) {
            if (saved.backgroundUrl) {
              backgrounds.push({
                id: "migrated-image",
                name: "Image Background",
                type: "image",
                url: saved.backgroundUrl
              });
            }
            if (saved.youtubeUrl) {
              backgrounds.push({
                id: "migrated-video",
                name: "YouTube Background",
                type: "video",
                url: saved.youtubeUrl
              });
            }
          }
          if (!backgrounds.length) backgrounds = cloneDefaultBackgrounds();

          // Rename the two presets created by the previous settings version.
          backgrounds = backgrounds.map(item => ({
            ...item,
            name: item.name === "Image Background"
              ? "Mountain Night Sky"
              : item.name === "YouTube Background"
                ? "Neon Sunset Drive"
                : item.name
          }));

          let selectedBackgroundId = saved.selectedBackgroundId;
          if (!backgrounds.some(item => item.id === selectedBackgroundId)) {
            selectedBackgroundId = saved.youtubeUrl && backgrounds.some(item => item.id === "migrated-video")
              ? "migrated-video"
              : backgrounds[0]?.id || "";
          }

          const savedCoordinates = saved.coordinates || DEFAULTS.coordinates;
          return {
            coordinates: savedCoordinates === "41.79722, -88.17000"
              ? DEFAULTS.coordinates
              : savedCoordinates,
            weatherSource: WEATHER_SOURCES[saved.weatherSource] ? saved.weatherSource : DEFAULTS.weatherSource,
            googleWeatherApiKey: saved.googleWeatherApiKey || "",
            clockAnimation: CLOCK_ANIMATIONS[saved.clockAnimation] ? saved.clockAnimation : DEFAULTS.clockAnimation,
            backgrounds,
            selectedBackgroundId
          };
        } catch {
          return {
            ...DEFAULTS,
            backgrounds: cloneDefaultBackgrounds()
          };
        }
      }

      function persistSettings() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(settings));
      }

      function showStatus(message) {
        statusEl.textContent = message;
        statusEl.classList.add("show");
        clearTimeout(statusTimer);
        statusTimer = setTimeout(() => statusEl.classList.remove("show"), 2200);
      }

      function applyBackground(url) {
        if (!url) {
          board.style.backgroundImage = "linear-gradient(145deg,#303747,#0d1018)";
          return;
        }
        board.style.backgroundImage =
          'linear-gradient(180deg,rgba(10,12,18,.05),rgba(10,12,18,.02)),url("' +
          url.replace(/"/g, "%22") + '")';
      }

      function youtubeVideoId(value) {
        const raw = String(value || "").trim();
        if (!raw) return "";
        try {
          const url = new URL(raw);
          const host = url.hostname.replace(/^www\./, "").toLowerCase();
          if (host === "youtu.be") return url.pathname.split("/").filter(Boolean)[0] || "";
          if (host === "youtube.com" || host === "m.youtube.com" || host === "music.youtube.com") {
            if (url.pathname === "/watch") return url.searchParams.get("v") || "";
            const parts = url.pathname.split("/").filter(Boolean);
            if (["embed", "shorts", "live"].includes(parts[0])) return parts[1] || "";
          }
        } catch {}
        return /^[A-Za-z0-9_-]{11}$/.test(raw) ? raw : "";
      }

      function stopVideoBackgrounds() {
        youtubeBackground.classList.remove("active");
        youtubeFrame.removeAttribute("src");
        const existing = document.getElementById("direct-video-background");
        if (existing) {
          existing.pause();
          existing.remove();
        }
      }

      function applyYouTubeBackground(url) {
        const id = youtubeVideoId(url);
        if (!id) return false;

        const params = new URLSearchParams({
          autoplay: "1",
          mute: "1",
          loop: "1",
          playlist: id,
          controls: "0",
          disablekb: "1",
          fs: "0",
          iv_load_policy: "3",
          rel: "0",
          playsinline: "1",
          cc_load_policy: "0"
        });
        youtubeFrame.src = "https://www.youtube-nocookie.com/embed/" + id + "?" + params.toString();
        youtubeBackground.classList.add("active");
        return true;
      }

      function applyDirectVideoBackground(url) {
        const video = document.createElement("video");
        video.id = "direct-video-background";
        video.src = url;
        video.autoplay = true;
        video.muted = true;
        video.loop = true;
        video.playsInline = true;
        video.preload = "auto";
        video.style.cssText = "position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;pointer-events:none;";
        board.insertBefore(video, board.firstChild);
        video.play().catch(() => {});
      }

      function selectedBackground() {
        return settings.backgrounds.find(item => item.id === settings.selectedBackgroundId) || null;
      }

      function applySelectedBackground() {
        stopVideoBackgrounds();
        const item = selectedBackground();
        if (!item) {
          applyBackground("");
          return;
        }

        if (item.type === "image") {
          applyBackground(item.url);
          return;
        }

        // Keep the image layer neutral behind video content.
        applyBackground("");
        if (!applyYouTubeBackground(item.url)) {
          applyDirectVideoBackground(item.url);
        }
      }

      function backgroundThumbnail(item) {
        if (!item) return "";
        if (item.type === "image") return item.url;
        const id = youtubeVideoId(item.url);
        return id ? "https://i.ytimg.com/vi/" + id + "/hqdefault.jpg" : "";
      }

      function escapeHtml(value) {
        return String(value || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function renderBackgroundPicker() {
        const current = selectedBackground();
        const thumb = backgroundThumbnail(current);

        backgroundCurrent.innerHTML = current
          ? '<span class="background-thumb' + (thumb ? '' : ' video-generic') + '"' +
              (thumb ? ' style="background-image:url(&quot;' + escapeHtml(thumb) + '&quot;)"' : '') + '>' +
              (thumb ? '' : '▶') +
            '</span><span class="background-title">' + escapeHtml(current.name) + '</span>'
          : '<span class="background-title">No background</span>';

        if (!settings.backgrounds.length) {
          backgroundMenu.innerHTML = '<div class="empty-backgrounds">No saved backgrounds</div>';
          return;
        }

        backgroundMenu.innerHTML = settings.backgrounds.map(item => {
          const itemThumb = backgroundThumbnail(item);
          const selected = item.id === settings.selectedBackgroundId ? " selected" : "";
          return '<div class="background-option' + selected + '" data-id="' + escapeHtml(item.id) + '">' +
            '<span class="background-thumb' + (itemThumb ? '' : ' video-generic') + '"' +
              (itemThumb ? ' style="background-image:url(&quot;' + escapeHtml(itemThumb) + '&quot;)"' : '') + '>' +
              (itemThumb ? '' : '▶') +
            '</span>' +
            '<span class="background-title">' + escapeHtml(item.name) + '</span>' +
            '<button class="remove-background" type="button" data-remove-id="' + escapeHtml(item.id) + '" aria-label="Remove background">×</button>' +
          '</div>';
        }).join("");
      }

      function setSelectedBackground(id) {
        if (!settings.backgrounds.some(item => item.id === id)) return;
        settings.selectedBackgroundId = id;
        persistSettings();
        renderBackgroundPicker();
        applySelectedBackground();
      }

      function makePresetId() {
        return "bg-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2,7);
      }

      function updateClock() {
        const now = new Date();
        try {
          const timeParts = new Intl.DateTimeFormat("en-US", {
            timeZone: timezone,
            hour: "numeric",
            minute: "2-digit",
            second: "2-digit",
            hour12: true
          }).formatToParts(now);

          const get = type => timeParts.find(p => p.type === type)?.value || "";
          clockMain.textContent = get("hour") + ":" + get("minute");
          clockSeconds.textContent = get("second");

          dateLine.textContent = new Intl.DateTimeFormat("en-US", {
            timeZone: timezone,
            weekday: "long",
            month: "long",
            day: "numeric"
          }).format(now);
        } catch {
          timezone = "UTC";
        }
      }

      function iconSvg(kind) {
        const sun = '<circle class="wx-stroke" cx="32" cy="32" r="11"/>' +
          '<path class="wx-stroke" d="M32 7v7M32 50v7M7 32h7M50 32h7M14.3 14.3l5 5M44.7 44.7l5 5M49.7 14.3l-5 5M19.3 44.7l-5 5"/>';
        const cloud = '<path class="wx-fill" d="M20 47h28.5c7.5 0 13.5-5.8 13.5-13 0-6.8-5.4-12.4-12.3-13-2-7.3-8.8-12-16.4-12-9 0-16.5 6.6-17.6 15.2C8.9 25.6 4 30.6 4 36.5 4 42.3 9.1 47 15.4 47H20Z"/>';
        const cloudStroke = '<path class="wx-stroke" d="M17 44h31c6.6 0 12-5.1 12-11.5S54.6 21 48 21h-1.2C44.7 13.9 38.3 9 31 9c-9 0-16.4 6.6-17.5 15.2C7.6 25.1 3 29.7 3 35.5 3 40.2 7.6 44 13.2 44H17Z"/>';
        const rain = '<path class="wx-stroke" d="M18 53l-2 6M31 53l-2 6M44 53l-2 6"/>';
        const snow = '<path class="wx-stroke" d="M18 52v7M14.5 55.5h7M31 52v7M27.5 55.5h7M44 52v7M40.5 55.5h7"/>';
        const bolt = '<path class="wx-fill" d="M30 47h12l-9 15 2-11H24l10-17-4 13Z"/>';
        const fog = '<path class="wx-stroke" d="M10 48h44M14 55h36"/>';

        let content = cloudStroke;
        if (kind === "sun") content = sun;
        if (kind === "partly") content = '<g transform="translate(-4,-5) scale(.72)">' + sun + '</g>' + cloud;
        if (kind === "cloud") content = cloudStroke;
        if (kind === "rain") content = cloud + rain;
        if (kind === "storm") content = cloud + bolt;
        if (kind === "snow") content = cloud + snow;
        if (kind === "fog") content = cloudStroke + fog;

        return '<svg class="wx-svg" viewBox="0 0 64 64" aria-hidden="true">' + content + '</svg>';
      }

      function weatherKind(code) {
        if (code === 0) return "sun";
        if ([1,2].includes(code)) return "partly";
        if (code === 3) return "cloud";
        if ([45,48].includes(code)) return "fog";
        if ([51,53,55,56,57,61,63,65,66,67,80,81,82].includes(code)) return "rain";
        if ([71,73,75,77,85,86].includes(code)) return "snow";
        if ([95,96,99].includes(code)) return "storm";
        return "cloud";
      }

      function dayLabel(dateString, index) {

        const d = new Date(dateString + "T12:00:00");

      function renderForecast(data) {

        currentIcon.innerHTML = iconSvg(weatherKind(data.current.weather_code));

        forecastEl.innerHTML = data.daily.time.slice(0,4).map((date, i) => {
          const hi = Math.round(data.daily.temperature_2m_max[i]);
          const lo = Math.round(data.daily.temperature_2m_min[i]);

            '<div class="day-label">' + dayLabel(date, i) + '</div>' +

      function renderWeatherFallback() {
        currentTemp.textContent = "--°";
        currentIcon.innerHTML = iconSvg("cloud");
        forecastEl.innerHTML = Array.from({ length: 4 }, (_, i) =>
          '<div class="day"><div class="day-label">' + (i === 0 ? "TODAY" : "---") +
          '</div><div class="day-icon">' + iconSvg("cloud") +
          '</div><div class="temps"><span>--</span><span>--</span></div></div>'
        ).join("");
      }

      function dmsToDecimal(deg, min, sec, dir) {
        let value = Math.abs(Number(deg)) + (Number(min || 0) / 60) + (Number(sec || 0) / 3600);
        if (/^[SW]$/i.test(dir)) value *= -1;
        return value;
      }

      function parseCoordinates(input) {
        const raw = String(input || "")
          .trim()
          .replace(/[−–—]/g, "-")
          .replace(/[′’]/g, "'")
          .replace(/[″”]/g, '"');
        if (!raw) throw new Error("Enter coordinates.");

        // Labeled decimals: lat: 41.79, lon: -88.17 (labels may appear in either order).
        const latLabel = raw.match(/(?:latitude|lat)\s*[:=]?\s*([+-]?\d+(?:\.\d+)?)/i);
        const lonLabel = raw.match(/(?:longitude|lon|lng)\s*[:=]?\s*([+-]?\d+(?:\.\d+)?)/i);
        if (latLabel && lonLabel) {
          const lat = Number(latLabel[1]);
          const lon = Number(lonLabel[1]);
          if (lat >= -90 && lat <= 90 && lon >= -180 && lon <= 180) return { lat, lon };
        }

        // DMS / cardinal formats, e.g. 41°47'50"N 88°10'12"W.
        const dmsLat = raw.match(/(\d{1,2})(?:\s*°|\s+)\s*(\d{1,2})?(?:\s*'|\s+)\s*(\d{1,2}(?:\.\d+)?)?\s*"?\s*([NS])/i);
        const dmsLon = raw.match(/(\d{1,3})(?:\s*°|\s+)\s*(\d{1,2})?(?:\s*'|\s+)\s*(\d{1,2}(?:\.\d+)?)?\s*"?\s*([EW])/i);
        if (dmsLat && dmsLon) {
          const lat = dmsToDecimal(dmsLat[1], dmsLat[2], dmsLat[3], dmsLat[4]);
          const lon = dmsToDecimal(dmsLon[1], dmsLon[2], dmsLon[3], dmsLon[4]);
          if (lat >= -90 && lat <= 90 && lon >= -180 && lon <= 180) return { lat, lon };
        }

        // Decimal coordinates with cardinal directions, e.g. 41.7972 N, 88.1700 W.
        const cardinalLat = raw.match(/([+-]?\d+(?:\.\d+)?)\s*°?\s*([NS])/i);
        const cardinalLon = raw.match(/([+-]?\d+(?:\.\d+)?)\s*°?\s*([EW])/i);
        if (cardinalLat && cardinalLon) {
          let lat = Math.abs(Number(cardinalLat[1])) * (/S/i.test(cardinalLat[2]) ? -1 : 1);
          let lon = Math.abs(Number(cardinalLon[1])) * (/W/i.test(cardinalLon[2]) ? -1 : 1);
          if (lat >= -90 && lat <= 90 && lon >= -180 && lon <= 180) return { lat, lon };
        }

        // Plain decimals tolerate commas, spaces, semicolons, parentheses, and pasted map formats.
        const nums = raw.match(/[+-]?\d+(?:\.\d+)?/g);
        if (!nums || nums.length < 2) throw new Error("Coordinates need a latitude and longitude.");
        let lat = Number(nums[0]);
        let lon = Number(nums[1]);

        // If someone pastes longitude first and it is obvious from the ranges, fix it automatically.
        if (Math.abs(lat) > 90 && Math.abs(lon) <= 90) [lat, lon] = [lon, lat];

        // Honor N/S/E/W anywhere in a simple decimal pair.
        const upper = raw.toUpperCase();
        if (upper.includes("N")) lat = Math.abs(lat);
        if (upper.includes("S")) lat = -Math.abs(lat);
        if (upper.includes("E")) lon = Math.abs(lon);
        if (upper.includes("W")) lon = -Math.abs(lon);

        if (!Number.isFinite(lat) || !Number.isFinite(lon) ||
            lat < -90 || lat > 90 || lon < -180 || lon > 180) {
          throw new Error("Coordinates are out of range.");
        }
        return { lat, lon };
      }

      function formatCoordinates(coords) {
        return coords.lat.toFixed(5) + ", " + coords.lon.toFixed(5);
      }

      async function fetchOpenMeteoWeather(lat, lon, source) {
        const params = new URLSearchParams({
          latitude: String(lat),
          longitude: String(lon),
          current: "temperature_2m,weather_code",
          daily: "weather_code,temperature_2m_max,temperature_2m_min",
          temperature_unit: "fahrenheit",
          timezone: "auto",
          forecast_days: "4"
        });

        let endpoint = "https://api.open-meteo.com/v1/forecast";
        if (source === "nbm") {
          endpoint = "https://api.open-meteo.com/v1/gfs";
          params.set("models", "nbm_conus");
        } else if (source === "gfs") {
          endpoint = "https://api.open-meteo.com/v1/gfs";
          params.set("models", "gfs_seamless");
        } else if (source === "ecmwf") {
          endpoint = "https://api.open-meteo.com/v1/ecmwf";
        }

        const wxRes = await fetch(endpoint + "?" + params.toString());
        if (!wxRes.ok) throw new Error("Selected weather source is unavailable right now.");
        const data = await wxRes.json();

        if (!data.current || !data.daily) {
          throw new Error("Selected weather source did not return a complete forecast.");
        }
        return data;
      }

      function nwsKind(text) {
        const value = String(text || "").toLowerCase();
        if (/thunder|t-storm|storm/.test(value)) return "storm";
        if (/snow|sleet|ice|freezing/.test(value)) return "snow";
        if (/rain|shower|drizzle/.test(value)) return "rain";
        if (/fog|haze|mist/.test(value)) return "fog";
        if (/partly|mostly sunny|mostly clear/.test(value)) return "partly";
        if (/cloud|overcast/.test(value)) return "cloud";
        if (/sunny|clear/.test(value)) return "sun";
        return "cloud";
      }

      function nwsCodeFromText(text) {
        const kind = nwsKind(text);
        return {
          sun: 0,
          partly: 2,
          cloud: 3,
          fog: 45,
          rain: 61,
          snow: 71,
          storm: 95
        }[kind] ?? 3;
      }

      function dateInTimezone(value, tz) {
        return new Intl.DateTimeFormat("en-CA", {
          timeZone: tz,
          year: "numeric",
          month: "2-digit",
          day: "2-digit"
        }).format(new Date(value));
      }

      async function fetchNwsWeather(lat, lon) {
        const headers = { Accept: "application/geo+json" };
        const pointRes = await fetch(
          "https://api.weather.gov/points/" + lat.toFixed(4) + "," + lon.toFixed(4),
          { headers }
        );
        if (!pointRes.ok) throw new Error("National Weather Service is unavailable right now.");
        const pointData = await pointRes.json();
        const props = pointData.properties || {};
        if (!props.forecast || !props.forecastHourly) {
          throw new Error("National Weather Service has no forecast for this ZIP code.");
        }

        const [forecastRes, hourlyRes] = await Promise.all([
          fetch(props.forecast, { headers }),
          fetch(props.forecastHourly, { headers })
        ]);
        if (!forecastRes.ok || !hourlyRes.ok) {
          throw new Error("National Weather Service forecast is unavailable right now.");
        }

        const forecastData = await forecastRes.json();
        const hourlyData = await hourlyRes.json();
        const periods = forecastData.properties?.periods || [];
        const hourlyPeriods = hourlyData.properties?.periods || [];
        const currentPeriod = hourlyPeriods[0] || periods[0];
        const nwsTimezone = props.timeZone || timezone;
        if (!currentPeriod) throw new Error("National Weather Service returned no forecast periods.");

        const grouped = new Map();
        periods.forEach(period => {
          const date = dateInTimezone(period.startTime, nwsTimezone);
          if (!grouped.has(date)) grouped.set(date, { time: date, high: null, low: null, code: null });
          const day = grouped.get(date);
          if (period.isDaytime) {
            day.high = period.temperature;
            day.code = nwsCodeFromText(period.shortForecast);
          } else {
            day.low = period.temperature;
            if (day.code == null) day.code = nwsCodeFromText(period.shortForecast);
          }
        });

        const days = Array.from(grouped.values()).slice(0, 4);
        // Fill an occasional missing high/low at the edge of the NWS 12-hour period list.
        for (let i = 0; i < days.length; i++) {
          if (days[i].high == null) days[i].high = days[i - 1]?.high ?? currentPeriod.temperature;
          if (days[i].low == null) days[i].low = days[i + 1]?.low ?? days[i].high;
          if (days[i].code == null) days[i].code = nwsCodeFromText(currentPeriod.shortForecast);
        }

        return {
          timezone: nwsTimezone,
          current: {
            temperature_2m: Number(currentPeriod.temperature),
            weather_code: nwsCodeFromText(currentPeriod.shortForecast)
          },
          daily: {
            time: days.map(day => day.time),
            temperature_2m_max: days.map(day => Number(day.high)),
            temperature_2m_min: days.map(day => Number(day.low)),
            weather_code: days.map(day => day.code)
          }
        };
      }

      async function fetchWeather(coordinateText, source = settings.weatherSource || "best_match") {
        const location = parseCoordinates(coordinateText);
        locationName = formatCoordinates(location);

        const data = source === "nws"
          ? await fetchNwsWeather(location.lat, location.lon)
          : await fetchOpenMeteoWeather(location.lat, location.lon, source);

        if (data.timezone) timezone = data.timezone;
        renderForecast(data);
        updateClock();
        return data;
      }

      async function refreshWeather({ quiet = false } = {}) {
        const selectedSource = settings.weatherSource || "best_match";
        try {
          await fetchWeather(settings.coordinates, selectedSource);
          if (!quiet) showStatus("Weather updated");
        } catch (error) {
          // Keep the dashboard useful if a specific upstream model has a temporary outage.
          if (selectedSource !== "best_match") {
            try {
              await fetchWeather(settings.coordinates, "best_match");
              const selectedLabel = WEATHER_SOURCES[selectedSource]?.label || "Selected source";
              metaEl.textContent = locationName + " • " + selectedLabel + " unavailable; showing Best Match";
              if (!quiet) showStatus(selectedLabel + " unavailable — using Best Match");
              return;
            } catch {}
          }

          renderWeatherFallback();
          metaEl.textContent = error.message || "Could not load weather.";
          if (!quiet) showStatus(error.message || "Could not load weather");
        }
      }

      function syncWeatherSourceUI() {
        const value = WEATHER_SOURCES[settings.weatherSource] ? settings.weatherSource : "best_match";
        weatherSourceLabel.textContent = WEATHER_SOURCES[value].label;
        weatherSourceMenu.querySelectorAll(".custom-option").forEach(option => {
          option.classList.toggle("selected", option.dataset.value === value);
        });
      }

      function openSettings() {
        coordinatesInput.value = settings.coordinates || DEFAULTS.coordinates;
        syncWeatherSourceUI();
        renderBackgroundPicker();
        backgroundEditor.classList.remove("open");
        weatherSourceSelect.classList.remove("open");
        backgroundSelect.classList.remove("open");
        settingsEl.classList.add("open");
        settingsEl.setAttribute("aria-hidden", "false");
        setTimeout(() => coordinatesInput.focus(), 0);
      }

      function closeSettings() {
        weatherSourceSelect.classList.remove("open");
        backgroundSelect.classList.remove("open");
        backgroundEditor.classList.remove("open");
        settingsEl.classList.remove("open");
        settingsEl.setAttribute("aria-hidden", "true");
      }

      settingsButton.addEventListener("click", openSettings);
      cancelSettings.addEventListener("click", () => {
        // Discard unsaved coordinate/weather-source changes. Background preset
        // changes are intentionally immediate and are already persisted.
        settings = loadSettings();
        closeSettings();
      });

      weatherSourceButton.addEventListener("click", () => {
        weatherSourceSelect.classList.toggle("open");
        backgroundSelect.classList.remove("open");
      });
      weatherSourceMenu.addEventListener("click", e => {
        const option = e.target.closest(".custom-option");
        if (!option) return;
        settings.weatherSource = option.dataset.value;
        syncWeatherSourceUI();
        weatherSourceSelect.classList.remove("open");
      });

      backgroundButton.addEventListener("click", () => {
        backgroundSelect.classList.toggle("open");
        weatherSourceSelect.classList.remove("open");
      });
      backgroundMenu.addEventListener("click", e => {
        const remove = e.target.closest("[data-remove-id]");
        if (remove) {
          e.stopPropagation();
          const id = remove.dataset.removeId;
          settings.backgrounds = settings.backgrounds.filter(item => item.id !== id);
          if (settings.selectedBackgroundId === id) {
            settings.selectedBackgroundId = settings.backgrounds[0]?.id || "";
          }
          persistSettings();
          renderBackgroundPicker();
          applySelectedBackground();
          return;
        }

        const option = e.target.closest(".background-option");
        if (!option) return;
        setSelectedBackground(option.dataset.id);
        backgroundSelect.classList.remove("open");
      });

      let newBackgroundType = "image";
      function setNewBackgroundType(type) {
        newBackgroundType = type;
        backgroundTypeImage.classList.toggle("active", type === "image");
        backgroundTypeVideo.classList.toggle("active", type === "video");
        backgroundNewUrlInput.placeholder = type === "image"
          ? "Image URL"
          : "YouTube or direct video URL";
      }

      addBackgroundButton.addEventListener("click", () => {
        backgroundEditor.classList.toggle("open");
        backgroundSelect.classList.remove("open");
        weatherSourceSelect.classList.remove("open");
        if (backgroundEditor.classList.contains("open")) {
          setNewBackgroundType("image");
          backgroundNameInput.value = "";
          backgroundNewUrlInput.value = "";
          setTimeout(() => backgroundNameInput.focus(), 0);
        }
      });
      backgroundTypeImage.addEventListener("click", () => setNewBackgroundType("image"));
      backgroundTypeVideo.addEventListener("click", () => setNewBackgroundType("video"));
      cancelBackgroundButton.addEventListener("click", () => backgroundEditor.classList.remove("open"));
      confirmBackgroundButton.addEventListener("click", () => {
        const name = backgroundNameInput.value.trim();
        const url = backgroundNewUrlInput.value.trim();
        if (!name) {
          showStatus("Give the background a name");
          backgroundNameInput.focus();
          return;
        }
        if (!url) {
          showStatus("Add a background URL");
          backgroundNewUrlInput.focus();
          return;
        }
        try {
          new URL(url);
        } catch {
          showStatus("That background URL is not valid");
          backgroundNewUrlInput.focus();
          return;
        }

        if (newBackgroundType === "video") {
          const isYoutube = !!youtubeVideoId(url);
          const isDirectVideo = /\.(mp4|webm|ogg)(?:[?#].*)?$/i.test(url);
          if (!isYoutube && !isDirectVideo) {
            showStatus("Use a YouTube, MP4, WebM, or OGG video URL");
            return;
          }
        }

        const item = {
          id: makePresetId(),
          name,
          type: newBackgroundType,
          url
        };
        settings.backgrounds.push(item);
        settings.selectedBackgroundId = item.id;
        persistSettings();
        renderBackgroundPicker();
        applySelectedBackground();
        backgroundEditor.classList.remove("open");
        showStatus("Background added");
      });

      settingsEl.addEventListener("click", e => {
        if (e.target === settingsEl) closeSettings();
      });

      document.addEventListener("click", e => {
        if (!weatherSourceSelect.contains(e.target)) weatherSourceSelect.classList.remove("open");
        if (!backgroundSelect.contains(e.target)) backgroundSelect.classList.remove("open");
      });

      document.addEventListener("keydown", e => {
        if (e.key === "Escape") {
          weatherSourceSelect.classList.remove("open");
          backgroundSelect.classList.remove("open");
          if (backgroundEditor.classList.contains("open")) {
            backgroundEditor.classList.remove("open");
          } else {
            closeSettings();
          }
        }

        if (e.key === "Shift" && !e.repeat) {
          const now = performance.now();
          if (now - lastShiftPress <= 450) {
            const willShow = !settingsButton.classList.contains("visible");
            settingsButton.classList.toggle("visible", willShow);
            if (!willShow) closeSettings();
            lastShiftPress = 0;
          } else {
            lastShiftPress = now;
          }
        }
      });

      saveSettings.addEventListener("click", async () => {
        let coords;
        try {
          coords = parseCoordinates(coordinatesInput.value);
        } catch (error) {
          showStatus(error.message || "Enter valid coordinates");
          coordinatesInput.focus();
          return;
        }

        settings.coordinates = formatCoordinates(coords);
        settings.weatherSource = WEATHER_SOURCES[settings.weatherSource] ? settings.weatherSource : "best_match";
        persistSettings();

        coordinatesInput.value = settings.coordinates;
        showStatus("Loading weather…");
        await refreshWeather({ quiet: true });
        closeSettings();
        showStatus("Settings saved");
      });

      // Initial paint.
      renderBackgroundPicker();
      applySelectedBackground();
      renderWeatherFallback();
      updateClock();
      refreshWeather({ quiet: true });

      // Time stays live; weather refreshes automatically every 15 minutes.
      setInterval(updateClock, 250);
      setInterval(() => refreshWeather({ quiet: true }), 15 * 60 * 1000);
    })();
  </script>
</body>
</html>

name: Seed shared preset store

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap-shared-store.yml"

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Seed canonical presets
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error             -X POST "https://mantledb.sh/v2/ryanehinkle-daq-board/presets"             -H "Content-Type: application/json"             --data-binary @presets.json
          echo
          curl --fail-with-body --silent --show-error             "https://mantledb.sh/v2/ryanehinkle-daq-board/presets"

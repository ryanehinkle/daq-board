name: Test anonymous shared store

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap-shared-store.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test MantleDB browser access
        shell: bash
        run: |
          set -euo pipefail
          url="https://mantledb.sh/v2/ryanehinkle-daq-board/presets"
          curl -sS -D /tmp/post-headers -o /tmp/post-body -X POST "$url"             -H "Origin: https://ryanehinkle.github.io"             -H "Content-Type: application/json"             --data '{"version":1,"backgrounds":[],"music":[]}'
          echo "--- POST HEADERS ---"
          cat /tmp/post-headers
          echo "--- POST BODY ---"
          cat /tmp/post-body
          echo
          echo "--- OPTIONS ---"
          curl -sS -D - -o /dev/null -X OPTIONS "$url"             -H "Origin: https://ryanehinkle.github.io"             -H "Access-Control-Request-Method: POST"             -H "Access-Control-Request-Headers: content-type"
          echo "--- GET ---"
          curl -sS -D - -o /tmp/get-body "$url"             -H "Origin: https://ryanehinkle.github.io"
          cat /tmp/get-body
